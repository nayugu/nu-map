<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Page not found - NU Map</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#1e293b;
      display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
    main{max-width:460px;text-align:center}
    h1{font-size:1.35rem;margin:0 0 .5em}
    p{color:#64748b;font-size:.95rem;margin:.5em 0}
    code{background:#f1f5f9;padding:1px 6px;border-radius:4px;font-size:.9em;word-break:break-all}
    a{color:#dc2626;text-decoration:none}a:hover{text-decoration:underline}
    ul{list-style:none;padding:0;margin:1em 0}
    li{margin:6px 0}
    .links{margin-top:1.6em;font-size:.9rem}
    /* Site-wide home mark: the same affordance on every NU Map page. Centred
       here because the whole card is, and it doubles as the way out. */
    .home{display:inline-block;line-height:0;margin-bottom:20px}
    .home img{width:36px;height:36px;object-fit:contain;opacity:.9;transition:opacity .15s ease}
    .home:hover img{opacity:1}
  </style>
</head>
<body>
  <main>
    <a class="home" href="/"><img src="/logo.png" alt="NU Map home" /></a>
    <h1>That page doesn't exist</h1>
    <p id="path"></p>
    <ul id="near"></ul>
    <p class="links">
      <a href="/">Open the planner</a> ·
      <a href="/data">Browse the data</a> ·
      <a href="/story">About NU Map</a>
    </p>
  </main>
  <script>
    // The path is passed as ?p= because this page is reached by a client-side
    // redirect from the app shell (see index.html), which is the only place
    // that can tell a mistyped URL from a real one: the SPA catch-all in
    // _redirects answers every unmatched path with the shell at status 200.
    var q = new URLSearchParams(location.search);
    var p = q.get("p") || "";
    var el = document.getElementById("path");
    if (p) {
      el.innerHTML = "There is nothing at <code></code> on numap.app.";
      el.querySelector("code").textContent = p;
    } else {
      el.textContent = "The address you followed isn't a page on numap.app.";
    }

    // Offer every ancestor of the attempted path. Directory pages exist for
    // each real segment, so /data/courses/MATH/317 usefully suggests
    // /data/courses/MATH and then /data/courses.
    var segs = p.split("?")[0].replace(/\/+$/, "").split("/").filter(Boolean);
    var near = document.getElementById("near");
    for (var i = segs.length - 1; i >= 1; i--) {
      var href = "/" + segs.slice(0, i).join("/");
      var a = document.createElement("a");
      a.href = href;
      a.textContent = href;
      var li = document.createElement("li");
      li.appendChild(a);
      near.appendChild(li);
    }
    if (near.children.length) {
      var lead = document.createElement("p");
      lead.textContent = "Did you mean:";
      near.parentNode.insertBefore(lead, near);
    }
  </script>
</body>
</html>
