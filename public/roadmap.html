<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap - NU Map</title>
  <meta name="description" content="What we have built for NU Map, what we are considering, and what we have decided not to build." />
  <link rel="canonical" href="https://numap.app/roadmap" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta property="og:title" content="NU Map Roadmap" />
  <meta property="og:description" content="What we have built for NU Map, what we are considering, and what we have decided not to build." />
  <meta property="og:url" content="https://numap.app/roadmap" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://numap.app/social-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <!--
    The page is a renderer. The CONTENT is roadmap/*.md, one file per item,
    compiled to /roadmap.json by build/roadmap.js (see roadmap/README.md).
    Adding, moving or retiring an item never touches this file. Items are
    built with DOM calls, never innerHTML, so nothing written in an item can
    become markup.
  -->
  <script>
    // Opened from a link to one item (#id): stay invisible until the page has
    // scrolled to it, then fade in. Otherwise the top of the page draws first
    // and then jumps, which reads as a flash. The 3s fallback means a slow or
    // failed load can never leave the page blank.
    if (location.hash.length > 1) {
      document.documentElement.classList.add("deeplink");
      setTimeout(function () { document.documentElement.classList.remove("deeplink"); }, 3000);
    }
    // Everything below the intro (filters, list, footer) waits for the data
    // and then fades in ONCE, instead of popping in and shoving the footer.
    // Only with JS on, so the no-JS message is never hidden; and the same 3s
    // fallback, so it can never stay invisible.
    document.documentElement.classList.add("js");
    setTimeout(function () { document.documentElement.classList.add("ready"); }, 3000);
  </script>
  <!--
    DARK MODE IS OFF: the accessory pages (like /story) come in one light
    theme, so this one does too. It is disabled, not deleted — to turn
    it back on, remove type="text/plain" from the script below and
    media="not all" from the second <style>.
  -->
  <script type="text/plain">
    // Same theme resolution as the app (index.html's pre-paint script): the
    // theme saved in NU Map wins, the OS preference is only the fallback.
    // Runs before paint so a dark-mode visitor never sees a light flash.
    try {
      var t = localStorage.getItem("ncp-theme") || localStorage.getItem("map-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage blocked: follow the OS */ }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fdfcfa;
      --surface: #ffffff;
      --text: #1f2328;
      --strong: #0f1216;
      --muted: #6a7078;
      --faint: #9aa0a7;
      --line: #ece7df;
      --link: #2f6fe0;
      /* Status hues, vivid pastel (the app's register). A pill's text is the
         same hue scaled toward black, never a grey, so it stays the colour. */
      --known: #f87171;
      --planned: #60a5fa;
      --maybe: #2dd4bf;
      --shipped: #4ade80;
      --declined: #a78bfa;
      --ink-mix: 55%;
    }
  </style>
  <style media="not all">
    /* Dark tokens, twice: once for the OS preference (unless the app's saved
       theme says light), once for the app's saved dark theme. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161a;
        --surface: #1a1d22;
        --text: #d5d9de;
        --strong: #eceff2;
        --muted: #8d949c;
        --faint: #636a73;
        --line: #262a31;
        --link: #7aa5f7;
        --flash: #2a2a1e;
        --ink-mix: 100%;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14161a;
      --surface: #1a1d22;
      --text: #d5d9de;
      --strong: #eceff2;
      --muted: #8d949c;
      --faint: #636a73;
      --line: #262a31;
      --link: #7aa5f7;
      --flash: #2a2a1e;
      --ink-mix: 100%;
    }
    :root[data-theme="light"] { color-scheme: light; }
  </style>
  <style>
    * { box-sizing: border-box; }
    html { scroll-padding-top: 132px; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-underline-offset: 2px; }
    .wrap { max-width: 740px; margin: 0 auto; padding: 48px 24px 96px;
      transition: opacity 0.9s cubic-bezier(0.6, 0, 0.4, 1); }
    html.deeplink .wrap { opacity: 0; }
    .toolbar, #list, footer.end { transition: opacity 0.6s cubic-bezier(0.6, 0, 0.4, 1); }
    html.js:not(.ready) .toolbar, html.js:not(.ready) #list, html.js:not(.ready) footer.end { opacity: 0; }
    @media (max-width: 520px) { .wrap { padding: 28px 16px 72px; } }

    /* Site-wide home mark: the same affordance on every NU Map page. */
    .home { display: inline-block; line-height: 0; margin-bottom: 22px; }
    .home img { width: 28px; height: 28px; object-fit: contain;
      opacity: 0.9; transition: opacity 0.15s ease; }
    .home:hover img { opacity: 1; }

    h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em;
      color: var(--strong); margin: 0 0 16px; font-weight: 700; }
    .lede { font-size: 1.05rem; margin: 0 0 14px; color: var(--text); }
    .aside { font-size: 0.92rem; color: var(--muted); margin: 0; line-height: 1.7; }
    /* One sentence per line, so the wrap falls where the thought does. On a
       phone they wrap anyway, and the break keeps them as two lines of thought. */
    .aside span { display: block; }
    /* On a phone both sentences wrap, so the break between them needs a gap
       or it looks like any other line. */
    @media (max-width: 520px) { .aside span + span { margin-top: 8px; } }

    /* ── Toolbar: sticky, because the list is meant to get long ─────────── */
    .toolbar {
      position: sticky; top: 0; z-index: 5;
      background: var(--bg);
      margin: 36px -24px 0; padding: 14px 24px 12px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, opacity 0.6s cubic-bezier(0.6, 0, 0.4, 1);
    }
    .toolbar.stuck { border-bottom-color: var(--line); }
    @media (max-width: 520px) { .toolbar { margin-inline: -16px; padding-inline: 16px; } }
    /* One row, always: a wrapped second row of filters read as cramped. When
       the window is too narrow it scrolls sideways inside itself (never the
       page), with the edge faded so the cut-off chip reads as "more". */
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      margin-inline: -2px; padding: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chips.overflow { mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap;
      font: inherit; font-size: 0.82rem; color: var(--muted);
      background: transparent; border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .chip:hover { color: var(--text); border-color: var(--faint); }
    .chip[aria-pressed="true"] { color: var(--strong); background: var(--surface);
      border-color: var(--faint); font-weight: 600; }
    .chip .n { font-variant-numeric: tabular-nums; color: var(--faint); font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--hue, var(--faint)); }

    .search { position: relative; margin-top: 12px; }
    .search input {
      width: 100%; font: inherit; font-size: 0.95rem; color: var(--text);
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 40px 9px 36px; outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { border-color: var(--planned);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--planned) 22%, transparent); }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
    .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font: 0.75rem ui-monospace, 'JetBrains Mono', monospace; color: var(--faint);
      border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
    .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
    @media (hover: none) { .search kbd { display: none; } }
    .status-line { font-size: 0.8rem; color: var(--faint); margin: 8px 2px 0; min-height: 1.2em; }

    /* ── Sections ─────────────────────────────────────────────────────── */
    section { margin-top: 36px; }
    section > header { margin-bottom: 6px; }
    h2 { display: flex; align-items: center; gap: 9px; margin: 0;
      font-size: 1.15rem; color: var(--strong); letter-spacing: -0.01em; }
    h2 .n { font-size: 0.85rem; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
    h2 .dot { width: 10px; height: 10px; }
    /* 0.82rem: the longest description (Maybe) fits on one line at full
       width from 0.83rem (measured); a hair under, for other browsers' fonts. */
    .blurb { font-size: 0.82rem; color: var(--muted); margin: 3px 0 0 19px; }
    .month { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--faint); margin: 22px 0 0 19px; }

    ol.items { list-style: none; margin: 0; padding: 0; }
    .item {
      position: relative; padding: 16px 12px 16px 19px; margin: 0 -12px 0 0;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; }
    .item::before {
      content: ""; position: absolute; left: 1px; top: 25px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--hue);
    }
    /* A linked item fades in, nothing more: it is already scrolled to just
       under the toolbar, so the eye is in the right place. A coloured flash
       was too loud for a page meant to read as calm. */
    /* A slow, diffuse left-to-right reveal, like a line being written: a
       gradient mask four times the item's width slides across, and its fade
       band (30% to 70% of the mask) is 1.6 item-widths wide, so the item
       brightens across rather than showing a moving edge. At rest the mask's
       opaque part covers the whole item, so nothing stays hidden after it. */
    .item.flash {
      -webkit-mask-image: linear-gradient(to right, #000 30%, transparent 70%);
              mask-image: linear-gradient(to right, #000 30%, transparent 70%);
      -webkit-mask-size: 400% 100%; mask-size: 400% 100%;
      -webkit-mask-position: 0 0; mask-position: 0 0;
      /* Slow start, a gentle middle, slow end. The ends linger longer than
         ease-in-out; the extra duration keeps the middle about as calm as
         before. Speed: the duration. Shape: the curve. */
      animation: arrive 2.8s cubic-bezier(0.6, 0, 0.4, 1);
    }
    @keyframes arrive {
      from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
      to   { -webkit-mask-position: 0 0;    mask-position: 0 0; }
    }
    .item h3 { margin: 0; font-size: 1rem; line-height: 1.4; color: var(--strong); font-weight: 600;
      padding-right: 34px; }
    .item p { margin: 6px 0 0; font-size: 0.94rem; }
    /* "Thanks to …": a signature, quieter than the description it follows. */
    .item p.by { margin-top: 12px; font-size: 0.78rem; color: var(--faint); }
    .by .extra { opacity: 0; transition: opacity 0.15s ease; }
    .item:hover .by .extra, .item:focus-within .by .extra { opacity: 1; }
    @media (hover: none) { .by .extra { display: none; } }

    /* Copy-link: the id is the reply we send, so getting it is one click. */
    .copy {
      position: absolute; top: 13px; right: 0;
      width: 28px; height: 28px; display: grid; place-items: center;
      background: none; border: 0; border-radius: 6px; cursor: pointer;
      color: var(--faint); opacity: 0; transition: opacity 0.12s, color 0.12s, background 0.12s;
    }
    .item:hover .copy, .copy:focus-visible, .copy.done { opacity: 1; }
    .copy:hover { color: var(--text); background: var(--line); }
    .copy.done { color: color-mix(in srgb, var(--shipped) var(--ink-mix), #000); }
    .copy svg { width: 15px; height: 15px; }
    @media (hover: none) { .copy { opacity: 0.7; } }

    .more {
      display: block; width: 100%; margin-top: 8px; padding: 10px;
      font: inherit; font-size: 0.88rem; color: var(--muted);
      background: none; border: 1px dashed var(--line); border-radius: 8px; cursor: pointer;
    }
    .more:hover { color: var(--text); border-color: var(--faint); }

    /* Dev only: files with a mistake, which the page has left out. */
    .problems { margin-top: 24px; padding: 12px 16px; border-radius: 10px; font-size: 0.88rem;
      background: color-mix(in srgb, var(--known) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--known) 45%, transparent); }
    .problems ul { margin: 6px 0 0; padding-left: 18px; }
    .problems code { font-size: 0.85em; }
    .empty { margin-top: 36px; padding: 28px 20px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: 12px; font-size: 0.95rem; }
    .empty p { margin: 0 0 4px; }

    footer.end { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line);
      font-size: 0.9rem; color: var(--muted); }
    footer.end .cta { font-size: 1rem; color: var(--text); margin: 0 0 10px; }
    footer.end .links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.85rem; }
    /* Information, not navigation: its own quiet line, so it isn't read as a fourth link. */
    footer.end .updated { margin: 12px 0 0; font-size: 0.78rem; color: var(--faint); }

    @media (prefers-reduced-motion: reduce) {
      .item.flash { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="/"><img src="/logo.png" alt="NU Map home" width="28" height="28" /></a>
    <h1>Roadmap</h1>
    <p class="lede">What we have built, what we are considering, and what we have decided not to build.</p>
    <p class="aside"><span>NU Map is made by two students, so nothing here has a date.</span>
      <span>We read every response, though not every one becomes an item here.</span></p>

    <div class="toolbar" id="toolbar" hidden>
      <div class="chips" id="chips" role="group" aria-label="Show"></div>
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search the roadmap" autocomplete="off"
          aria-label="Search the roadmap" />
        <kbd aria-hidden="true">/</kbd>
      </div>
      <p class="status-line" id="status" aria-live="polite"></p>
    </div>

    <main id="list">
      <noscript><p class="empty">This page needs JavaScript. The full list is also at
        <a href="/roadmap.json">roadmap.json</a>.</p></noscript>
    </main>

    <footer class="end">
      <p class="cta">Something missing, or wrong?
        <a href="https://forms.gle/CzXE25WRtJnXWE1U9" target="_blank" rel="noopener noreferrer">Tell us</a>.</p>
      <div class="links">
        <a href="/">Open the planner</a>
        <a href="/story">The story</a>
        <a href="/privacy.html">Privacy</a>
      </div>
      <p class="updated" id="updated"></p>
    </footer>
  </div>

  <script>
  (function () {
    "use strict";
    // Section order, labels and blurbs come from the data (build/roadmap.js
    // SECTIONS), and items arrive already sorted within each section, so the
    // page has no opinion about either.
    var ORDER = [], SECT = {};
    // Any long section folds to its first PREVIEW items, and the button then
    // reveals STEP more per click, so a long Shipped never dumps everything
    // at once. It folds only when that hides at least MIN_HIDDEN (a "Show 1
    // more" button is sillier than the item), so a step that would leave a
    // tiny remainder takes it too. Never folded while searching, when the
    // visitor picked that section's filter, or for the section a link opens.
    var PREVIEW = 5, STEP = 10, MIN_HIDDEN = 3;
    var FORM = "https://forms.gle/CzXE25WRtJnXWE1U9";

    var data, filter = "all", query = "", limits = {}; // section key → items shown (default PREVIEW)
    var $ = function (id) { return document.getElementById(id); };

    function el(tag, attrs, kids) {
      var n = document.createElement(tag);
      if (attrs) for (var k in attrs) {
        if (k === "class") n.className = attrs[k];
        else if (k === "text") n.textContent = attrs[k];
        else if (k === "style") n.setAttribute("style", attrs[k]);
        else n.setAttribute(k, attrs[k]);
      }
      (kids || []).forEach(function (c) { if (c != null) n.append(c); });
      return n;
    }
    function hue(status) { return "--hue: var(--" + status + ")"; }

    // Dates are calendar facts ("2026-09"), not instants: format in UTC so a
    // visitor west of Greenwich does not see the previous month.
    function parseDate(s) {
      var p = String(s).split("-").map(Number);
      return new Date(Date.UTC(p[0], (p[1] || 1) - 1, p[2] || 1));
    }
    function fmt(s, withDay) {
      var opts = { month: withDay ? "short" : "long", year: "numeric", timeZone: "UTC" };
      if (withDay && String(s).split("-").length === 3) opts.day = "numeric";
      return parseDate(s).toLocaleDateString("en-US", opts);
    }

    // [text](url) → link; everything else stays text. Only http(s) and
    // site-relative targets are honoured.
    var LINK = /\[([^\]]+)\]\(((?:https?:\/\/|\/(?!\/))[^)\s]+)\)/g;
    function rich(text) {
      var out = [], last = 0, m;
      LINK.lastIndex = 0;
      while ((m = LINK.exec(text))) {
        if (m.index > last) out.push(text.slice(last, m.index));
        var a = el("a", { href: m[2], text: m[1] });
        if (/^https?:/.test(m[2])) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
        out.push(a);
        last = LINK.lastIndex;
      }
      if (last < text.length) out.push(text.slice(last));
      return out;
    }

    function matches(item) {
      if (!query) return true;
      var hay = (item.title + " " + item.body + " " + (item.credit || "") + " " +
        SECT[item.status].label).toLowerCase();
      return query.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
    }

    var COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l2.12-2.12a3 3 0 0 0-4.24-4.24l-.7.7"/><path d="M9.5 6.5a3 3 0 0 0-4.24 0L3.14 8.62a3 3 0 0 0 4.24 4.24l.7-.7"/></svg>';
    var DONE_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>';

    function renderItem(item) {
      // A faint signature under the description, and ONLY when someone is
      // credited by name ("Thanks to Lily H."). Anonymous feedback shows
      // nothing: a line that says "through feedback" competes with the
      // description and tells the reader nothing they act on. The date fades
      // in beside the signature on hover.
      var by = null;
      if (item.credit) {
        // One phrase for every section. A verb chosen by section ("Reported
        // by" for a known issue) would silently change when the fix ships
        // and the item moves to Shipped; a credit should never change.
        var who = "Thanks to " + item.credit;
        var extra = item.status === "shipped" && item.shipped ? "shipped " + fmt(item.shipped, true) : item.date ? fmt(item.date) : "";
        by = el("p", { class: "by" }, [who, extra ? el("span", { class: "extra", text: " · " + extra }) : null]);
      }

      var copy = el("button", { class: "copy", type: "button", title: "Copy a link to this", "aria-label": "Copy a link to " + item.title });
      copy.innerHTML = COPY_ICON; // static icon markup, never item data
      copy.addEventListener("click", function () {
        var url = location.origin + location.pathname + "#" + item.id;
        var done = function () {
          copy.innerHTML = DONE_ICON; copy.classList.add("done"); copy.title = "Copied";
          setTimeout(function () { copy.innerHTML = COPY_ICON; copy.classList.remove("done"); copy.title = "Copy a link to this"; }, 1600);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { location.hash = item.id; });
        else location.hash = item.id;
      });

      var paras = String(item.body).split(/\n\s*\n/).map(function (p) { return el("p", null, rich(p.trim())); });
      return el("li", { class: "item", id: item.id, style: hue(item.status) },
        [el("h3", { text: item.title }), copy].concat(paras, [by]));
    }

    function groupFor(status) {
      return data.items.filter(function (i) { return i.status === status; });
    }

    function render() {
      var root = $("list");
      root.textContent = "";
      var total = 0;

      ORDER.forEach(function (status) {
        if (filter !== "all" && filter !== status) return;
        var all = groupFor(status);
        var shown = all.filter(matches);
        if (!shown.length) return;
        total += shown.length;

        var meta = SECT[status];
        var sec = el("section", { "aria-labelledby": "h-" + status }, [
          el("header", null, [
            el("h2", { id: "h-" + status }, [
              el("span", { class: "dot", style: hue(status) }),
              meta.label,
              el("span", { class: "n", text: String(shown.length) })
            ]),
            query ? null : el("p", { class: "blurb", text: meta.blurb })
          ])
        ]);

        var limit = limits[status] || PREVIEW;
        var fold = !query && filter !== status && shown.length - limit >= MIN_HIDDEN;
        var visible = fold ? shown.slice(0, limit) : shown;

        if (status === "shipped") {
          var month = null, ol = null;
          visible.forEach(function (item) {
            var m = String(item.shipped).slice(0, 7);
            if (m !== month) {
              month = m;
              // A label, not a heading: items are h3 under the section's h2.
              sec.append(el("p", { class: "month", text: fmt(m) }));
              ol = el("ol", { class: "items" });
              sec.append(ol);
            }
            ol.append(renderItem(item));
          });
        } else {
          sec.append(el("ol", { class: "items" }, visible.map(renderItem)));
        }

        if (fold) {
          // "older" for Shipped, which is sorted by date: a month cut part-way
          // then reads as a list that continues, not a month that is complete.
          var hidden = shown.length - limit;
          // A step that would leave a tiny remainder takes it too.
          var next = hidden - STEP < MIN_HIDDEN ? hidden : STEP;
          var more = el("button", { class: "more", type: "button",
            text: "Show " + next + (status === "shipped" ? " older" : " more") });
          more.addEventListener("click", function () { limits[status] = limit + next; render(); });
          sec.append(more);
        }
        root.append(sec);
      });

      if (!total) {
        var a = el("a", { href: FORM, target: "_blank", rel: "noopener noreferrer", text: "Tell us about it" });
        root.append(el("div", { class: "empty" }, [
          el("p", { text: query ? "Nothing here matches “" + $("q").value.trim() + "”." : "Nothing here yet." }),
          el("p", null, ["Not on the list? ", a, "."])
        ]));
      }
      $("status").textContent = query ? total + (total === 1 ? " result" : " results") : "";
    }

    function renderChips() {
      var chips = $("chips");
      chips.textContent = "";
      var opts = [["all", "All", data.items.length]].concat(ORDER.map(function (s) {
        return [s, SECT[s].label, data.items.filter(function (i) { return i.status === s; }).length];
      }));
      opts.forEach(function (o) {
        if (o[0] !== "all" && !o[2]) return;
        var b = el("button", { class: "chip", type: "button", "aria-pressed": String(filter === o[0]) }, [
          o[0] === "all" ? null : el("span", { class: "dot", style: hue(o[0]) }),
          o[1],
          el("span", { class: "n", text: String(o[2]) })
        ]);
        b.addEventListener("click", function () { setFilter(o[0]); });
        chips.append(b);
      });
      fadeChips();
    }

    // Fade the right edge only while there is more row to scroll to.
    function fadeChips() {
      var c = $("chips");
      c.classList.toggle("overflow", c.scrollLeft + c.clientWidth < c.scrollWidth - 1);
    }
    $("chips").addEventListener("scroll", fadeChips, { passive: true });
    window.addEventListener("resize", fadeChips);

    function setFilter(f, quiet) {
      filter = f;
      var url = new URL(location.href);
      if (f === "all") url.searchParams.delete("show"); else url.searchParams.set("show", f);
      if (!quiet) url.hash = "";
      history.replaceState(null, "", url);
      renderChips(); render();
    }

    // A link to one item (#id) must land on it whatever the page was doing:
    // clear whatever would hide it, unfold Shipped, then point at it.
    function goToHash() {
      var id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      var item = data.items.filter(function (i) { return i.id === id; })[0];
      if (!item) return;
      if ((filter !== "all" && filter !== item.status) || query) {
        filter = "all"; query = ""; $("q").value = "";
        var url = new URL(location.href); url.searchParams.delete("show");
        history.replaceState(null, "", url);
        renderChips();
      }
      limits[item.status] = Infinity; // a linked item is never folded away
      render();
      var node = $(id);
      if (!node) return;
      node.scrollIntoView({ block: "start" });
      node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
    }

    function boot(json) {
      data = json;
      data.sections.forEach(function (s) { ORDER.push(s.key); SECT[s.key] = s; });
      // An unknown status renders nowhere, which is how an item gets lost.
      // The build refuses one; this keeps a bad edit visible regardless.
      data.items.forEach(function (i) { if (!SECT[i.status]) console.warn("roadmap: unknown status", i.id, i.status); });
      // Files with a mistake are left off the page. Only the dev server sends
      // `problems`, so this banner is for whoever is editing, never a visitor.
      if (data.problems && data.problems.length) {
        $("toolbar").before(el("div", { class: "problems" }, [
          el("strong", { text: data.problems.length + " roadmap file(s) left off this page until fixed:" }),
          el("ul", null, data.problems.map(function (p) {
            return el("li", null, [el("code", { text: "roadmap/" + p.file }), " " + p.errors.join("; ")]);
          }))
        ]));
      }
      var show = new URL(location.href).searchParams.get("show");
      if (show && SECT[show]) filter = show;
      $("toolbar").hidden = false;
      if (data.updated) $("updated").textContent = "Updated " + fmt(data.updated, true);
      renderChips(); render();
      if (location.hash) goToHash();
      revealPage(); // only now, with the item already in place
    }

    // Ends the hidden-until-scrolled state the <head> script starts for a
    // link to one item. Safe to call when it never started.
    function revealPage() {
      document.documentElement.classList.remove("deeplink");
      document.documentElement.classList.add("ready");
    }

    var timer;
    $("q").addEventListener("input", function (e) {
      clearTimeout(timer);
      timer = setTimeout(function () { query = e.target.value.trim().toLowerCase(); render(); }, 80);
    });
    $("q").addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.target.value = ""; query = ""; render(); e.target.blur(); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "/" && document.activeElement !== $("q") && !e.metaKey && !e.ctrlKey) {
        e.preventDefault(); $("q").focus();
      }
    });
    window.addEventListener("hashchange", goToHash);

    // A hairline under the toolbar only once it is actually stuck.
    var sentinel = el("div", { style: "height:1px" });
    $("toolbar").before(sentinel);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (es) {
        $("toolbar").classList.toggle("stuck", !es[0].isIntersecting);
      }).observe(sentinel);
    }

    fetch("/roadmap.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(boot)
      .catch(function () {
        revealPage();
        $("list").textContent = "";
        $("list").append(el("div", { class: "empty" }, [
          el("p", { text: "The roadmap could not load." }),
          el("p", null, ["Try again in a moment, or read ", el("a", { href: "/roadmap.json", text: "the raw list" }), "."])
        ]));
      });
  })();
  </script>
</body>
</html>
