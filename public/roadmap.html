<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap - NU Map</title>
  <meta name="description" content="What we have built for NU Map, what we are considering, and what we have decided not to build." />
  <link rel="canonical" href="https://numap.app/roadmap" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta property="og:title" content="NU Map Roadmap" />
  <meta property="og:description" content="What we have built for NU Map, what we are considering, and what we have decided not to build." />
  <meta property="og:url" content="https://numap.app/roadmap" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://numap.app/social-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <!--
    The page is a renderer. The CONTENT is roadmap/*.md, one file per item,
    compiled to /roadmap.json by build/roadmap.js (see roadmap/README.md).
    Adding, moving or retiring an item never touches this file. Items are
    built with DOM calls, never innerHTML, so nothing written in an item can
    become markup.
  -->
  <script>
    // Opened from a link to one item (#id): stay invisible until the page has
    // scrolled to it, then fade in. Otherwise the top of the page draws first
    // and then jumps, which reads as a flash. The 3s fallback means a slow or
    // failed load can never leave the page blank.
    if (location.hash.length > 1) {
      // The page places a linked item itself; the browser restoring an old
      // scroll position on a reload would fight that (and read as the visitor
      // scrolling).
      try { history.scrollRestoration = "manual"; } catch (e) { /* old browser */ }
      document.documentElement.classList.add("deeplink");
      setTimeout(function () { document.documentElement.classList.remove("deeplink"); }, 3000);
    }
    // Everything below the intro (filters, list, footer) waits for the data
    // and then fades in ONCE, instead of popping in and shoving the footer.
    // Only with JS on, so the no-JS message is never hidden; and the same 3s
    // fallback, so it can never stay invisible.
    document.documentElement.classList.add("js");
    setTimeout(function () { document.documentElement.classList.add("ready"); }, 3000);
  </script>
  <!--
    DARK MODE IS OFF: the accessory pages (like /story) come in one light
    theme, so this one does too. It is disabled, not deleted — to turn
    it back on, remove type="text/plain" from the script below and
    media="not all" from the second <style>.
  -->
  <script type="text/plain">
    // Same theme resolution as the app (index.html's pre-paint script): the
    // theme saved in NU Map wins, the OS preference is only the fallback.
    // Runs before paint so a dark-mode visitor never sees a light flash.
    try {
      var t = localStorage.getItem("ncp-theme") || localStorage.getItem("map-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage blocked: follow the OS */ }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fdfcfa;
      --surface: #ffffff;
      --text: #1f2328;
      --strong: #0f1216;
      --muted: #6a7078;
      --faint: #9aa0a7;
      --line: #ece7df;
      --link: #2f6fe0;
      /* Status hues, vivid pastel (the app's register). A pill's text is the
         same hue scaled toward black, never a grey, so it stays the colour. */
      --known: #f87171;
      --planned: #60a5fa;
      --maybe: #2dd4bf;
      --shipped: #4ade80;
      --declined: #a78bfa;
      --ink-mix: 55%;
    }
  </style>
  <style media="not all">
    /* Dark tokens, twice: once for the OS preference (unless the app's saved
       theme says light), once for the app's saved dark theme. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161a;
        --surface: #1a1d22;
        --text: #d5d9de;
        --strong: #eceff2;
        --muted: #8d949c;
        --faint: #636a73;
        --line: #262a31;
        --link: #7aa5f7;
        --flash: #2a2a1e;
        --ink-mix: 100%;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14161a;
      --surface: #1a1d22;
      --text: #d5d9de;
      --strong: #eceff2;
      --muted: #8d949c;
      --faint: #636a73;
      --line: #262a31;
      --link: #7aa5f7;
      --flash: #2a2a1e;
      --ink-mix: 100%;
    }
    :root[data-theme="light"] { color-scheme: light; }
  </style>
  <style>
    * { box-sizing: border-box; }
    html { scroll-padding-top: 132px; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-underline-offset: 2px; }
    .wrap { max-width: 740px; margin: 0 auto; padding: 48px 24px 96px;
      transition: opacity 0.9s cubic-bezier(0.6, 0, 0.4, 1); }
    html.deeplink .wrap { opacity: 0; }
    .toolbar, #list, footer.end { transition: opacity 0.6s cubic-bezier(0.6, 0, 0.4, 1); }
    html.js:not(.ready) .toolbar, html.js:not(.ready) #list, html.js:not(.ready) footer.end { opacity: 0; }
    @media (max-width: 520px) { .wrap { padding: 28px 16px 72px; } }

    /* Site-wide home mark: "← [mark]", the mark at full size so it stays the
       brand, and one faint arrow so it reads as a way out (a visitor who came
       from an emailed link has no browser history to go back through). On
       hover or focus "Back to the planner" slides out beside it; on a touch
       screen the arrow alone carries it. story.html and privacy.html carry the
       same block; keep the three in step. */
    .home { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 22px -8px;
      padding: 4px 8px; border-radius: 8px; text-decoration: none;
      color: var(--faint); font-size: 0.85rem; font-weight: 500; line-height: 1;
      transition: color 0.15s ease, background 0.15s ease; }
    .home:hover, .home:focus-visible { color: var(--strong); background: var(--surface); }
    .home .arrow { width: 14px; height: 14px; flex: none; transition: transform 0.2s ease; }
    .home:hover .arrow, .home:focus-visible .arrow { transform: translateX(-2px); }
    .home img { width: 28px; height: 28px; object-fit: contain; }
    .home .label { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; margin-left: 0;
      transition: max-width 0.3s ease, opacity 0.2s ease, margin-left 0.3s ease; }
    .home:hover .label, .home:focus-visible .label { max-width: 12em; opacity: 1; margin-left: 4px; }
    /* A tap counts as hover, so the label began sliding out while the planner
       loaded and was caught half open, clipped. */
    @media (hover: none) { .home .label { display: none; } }

    h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em;
      color: var(--strong); margin: 0 0 16px; font-weight: 700; }
    .lede { font-size: 1.05rem; margin: 0 0 14px; color: var(--text); }
    /* Same size as the section descriptions (.blurb), so the page has one
       size for its quiet notes. */
    .aside { font-size: 0.82rem; color: var(--muted); margin: 0; line-height: 1.7; }

    /* ── Toolbar: sticky, because the list is meant to get long ─────────── */
    .toolbar {
      position: sticky; top: 0; z-index: 5;
      background: var(--bg);
      margin: 36px -24px 0; padding: 14px 24px 12px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, opacity 0.6s cubic-bezier(0.6, 0, 0.4, 1);
    }
    .toolbar.stuck { border-bottom-color: var(--line); }
    @media (max-width: 520px) { .toolbar { margin-inline: -16px; padding-inline: 16px; } }
    /* One row, always: a wrapped second row of filters read as cramped. When
       the window is too narrow it scrolls sideways inside itself (never the
       page), with the edge faded so the cut-off chip reads as "more". */
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      margin-inline: -2px; padding: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chips.overflow { mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap;
      font: inherit; font-size: 0.82rem; color: var(--muted);
      background: transparent; border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .chip:hover { color: var(--text); border-color: var(--faint); }
    .chip[aria-pressed="true"] { color: var(--strong); background: var(--surface);
      border-color: var(--faint); font-weight: 600; }
    .chip .n { font-variant-numeric: tabular-nums; color: var(--faint); font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--hue, var(--faint)); }

    .search { position: relative; margin-top: 12px; }
    .search input {
      width: 100%; font: inherit; font-size: 0.95rem; color: var(--text);
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 40px 9px 36px; outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { border-color: var(--planned);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--planned) 22%, transparent); }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
    .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font: 0.75rem ui-monospace, 'JetBrains Mono', monospace; color: var(--faint);
      border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
    .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
    @media (hover: none) { .search kbd { display: none; } }
    .status-line { font-size: 0.8rem; color: var(--faint); margin: 8px 2px 0; min-height: 1.2em; }

    /* ── Sections ─────────────────────────────────────────────────────── */
    section { margin-top: 36px; }
    section > header { margin-bottom: 6px; }
    h2 { display: flex; align-items: center; gap: 9px; margin: 0;
      font-size: 1.15rem; color: var(--strong); letter-spacing: -0.01em; }
    h2 .n { font-size: 0.85rem; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
    h2 .dot { width: 10px; height: 10px; }
    /* 0.82rem: the longest description (Maybe) fits on one line at full
       width from 0.83rem (measured); a hair under, for other browsers' fonts. */
    .blurb { font-size: 0.82rem; color: var(--muted); margin: 3px 0 0 19px; }
    .month { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--faint); margin: 22px 0 0 19px; }

    ol.items { list-style: none; margin: 0; padding: 0; }
    .item {
      position: relative; padding: 16px 12px 16px 19px; margin: 0 -12px 0 0;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; }
    .item::before {
      content: ""; position: absolute; left: 1px; top: 25px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--hue);
    }
    /* A link to one item (the roadmap's main use: a reply to feedback) opens
       on that item alone, centred, solid, with "See full roadmap" under it
       (.see-all); see spotlight(). Tried and dropped along the way, so not to
       be re-tried blind: a left-to-right text reveal (the linked item was the
       FAINT one while its neighbour was already solid, so a hurried reader
       read the wrong item), a bar beside it, an outline traced round it, and a
       colour wave through its text. Each still asked the eye to find the item
       among others; showing it alone does not. */
    .item h3 { margin: 0; font-size: 1rem; line-height: 1.4; color: var(--strong); font-weight: 600;
      padding-right: 34px; }
    .item p { margin: 6px 0 0; font-size: 0.94rem; }
    /* "Thanks to …": a signature, quieter than the description it follows. */
    .item p.by { margin-top: 12px; font-size: 0.78rem; color: var(--faint); }
    .by .extra { opacity: 0; transition: opacity 0.15s ease; }
    .item:hover .by .extra, .item:focus-within .by .extra { opacity: 1; }
    @media (hover: none) { .by .extra { display: none; } }

    /* Copy-link: the id is the reply we send, so getting it is one click. */
    .copy {
      position: absolute; top: 13px; right: 0;
      width: 28px; height: 28px; display: grid; place-items: center;
      background: none; border: 0; border-radius: 6px; cursor: pointer;
      color: var(--faint); opacity: 0; transition: opacity 0.12s, color 0.12s, background 0.12s;
    }
    .item:hover .copy, .copy:focus-visible, .copy.done { opacity: 1; }
    .copy:hover { color: var(--text); background: var(--line); }
    .copy.done { color: color-mix(in srgb, var(--shipped) var(--ink-mix), #000); }
    .copy svg { width: 15px; height: 15px; }
    @media (hover: none) { .copy { opacity: 0.7; } }

    .more {
      display: block; width: 100%; margin-top: 8px; padding: 10px;
      font: inherit; font-size: 0.88rem; color: var(--muted);
      background: none; border: 1px dashed var(--line); border-radius: 8px; cursor: pointer;
    }
    .more:hover { color: var(--text); border-color: var(--faint); }

    /* "See full roadmap", under a linked item shown on its own. Absolute,
       so adding and removing it never moves anything (the item least of all). */
    .see-all {
      /* Centred under the item: the view is a centred composition, and the
         button is its one next step, not part of the item's text. Labelled,
         not an arrow that explains itself on hover: phones have no hover. */
      position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
      top: calc(100% + 18px); z-index: 2;
      display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 0.88rem; font-weight: 500; color: var(--muted);
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      padding: 7px 14px; cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, opacity 0.4s ease;
    }
    .see-all:hover, .see-all:focus-visible { color: var(--strong); border-color: var(--faint); }
    .see-all.gone, .spot-head.gone, .home.spot-home.gone { opacity: 0; pointer-events: none; }
    /* The home link while an item is shown alone: the page is scrolled to
       centre the item, so the real link is usually off-screen. This copy sits
       in the corner exactly where the real one sits on a normal visit, so a
       visitor from an email sees whose page this is and has a way to the
       planner. It fades out on reveal, when the real one is back. */
    .home.spot-home { position: fixed; z-index: 3; margin: 0;
      transition: color 0.15s ease, background 0.15s ease, opacity 0.9s cubic-bezier(0.6, 0, 0.4, 1); }
    /* It lives outside .wrap, so it would skip the page's fade-in and pop in
       ahead of the item; this ties it to the same fade. */
    html.deeplink .home.spot-home { opacity: 0; }
    /* The item's section heading, copied above it while it is shown alone:
       for a reply, the section IS the answer. Same spacing as in the list, so
       for a section's first item the copy sits exactly on the real heading
       and the swap on reveal is seamless. Absolute, so it never moves the item. */
    .spot-head { position: absolute; left: 0; right: 12px; bottom: 100%;
      transition: opacity 0.4s ease; }
    .spot-head header { margin-bottom: 6px; } /* = section > header; measured to match the real heading to the pixel */
    /* The one deliberate difference: no count next to a lone item. Invisible
       rather than removed, so everything else stays pixel-identical. */
    .spot-head .n { visibility: hidden; }
    /* The copy lives INSIDE the item, so ".item p" (0.94rem, no indent) would
       restyle its description and month line; restate the page's own styles
       at a specificity that wins. */
    .item .spot-head p.blurb { font-size: 0.82rem; color: var(--muted); margin: 3px 0 0 19px; }
    .item .spot-head p.month { font-size: 0.72rem; color: var(--faint); margin: 18px 0 0 19px; }

    /* Dev only: files with a mistake, which the page has left out. */
    .problems { margin-top: 24px; padding: 12px 16px; border-radius: 10px; font-size: 0.88rem;
      background: color-mix(in srgb, var(--known) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--known) 45%, transparent); }
    .problems ul { margin: 6px 0 0; padding-left: 18px; }
    .problems code { font-size: 0.85em; }
    .empty { margin-top: 36px; padding: 28px 20px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: 12px; font-size: 0.95rem; }
    .empty p { margin: 0 0 4px; }

    footer.end { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line);
      font-size: 0.9rem; color: var(--muted); }
    footer.end .cta { font-size: 1rem; color: var(--text); margin: 0 0 10px; }
    footer.end .links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.85rem; }
    /* Information, not navigation: its own quiet line, so it isn't read as a fourth link. */
    footer.end .updated { margin: 12px 0 0; font-size: 0.78rem; color: var(--faint); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="/" aria-label="Back to the NU Map planner">
      <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>
      <img src="/logo.png" alt="" width="28" height="28" />
      <span class="label">Back to the planner</span>
    </a>
    <h1>Roadmap</h1>
    <p class="lede">What we have built, what we are considering, and what we have decided not to build.</p>
    <p class="aside">NU Map is made by two students, so we can't promise dates. We read every response; not all become items.</p>

    <div class="toolbar" id="toolbar" hidden>
      <div class="chips" id="chips" role="group" aria-label="Show"></div>
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search the roadmap" autocomplete="off"
          aria-label="Search the roadmap" />
        <kbd aria-hidden="true">/</kbd>
      </div>
      <p class="status-line" id="status" aria-live="polite"></p>
    </div>

    <main id="list">
      <noscript><p class="empty">This page needs JavaScript. The full list is also at
        <a href="/roadmap.json">roadmap.json</a>.</p></noscript>
    </main>

    <footer class="end">
      <p class="cta">Something missing, or wrong?
        <a href="https://forms.gle/CzXE25WRtJnXWE1U9" target="_blank" rel="noopener noreferrer">Tell us</a>.</p>
      <div class="links">
        <a href="/">Open the planner</a>
        <a href="/story">The story</a>
        <a href="/privacy.html">Privacy</a>
      </div>
      <p class="updated" id="updated"></p>
    </footer>
  </div>

  <script>
  (function () {
    "use strict";
    // Section order, labels and blurbs come from the data (build/roadmap.js
    // SECTIONS), and items arrive already sorted within each section, so the
    // page has no opinion about either.
    var ORDER = [], SECT = {};
    // Every section shows its top PREVIEW items (pin with `top: true` to
    // choose them), and the button reveals STEP more per click: about a
    // screen at a time, in proportion to the three showing (10 more than
    // quadrupled a section in one click). MIN_HIDDEN is 1: with only three
    // showing, the button is smaller than the item it hides, so even
    // "Show 1 more" saves room and keeps every section at three. But a STEP
    // that would leave ABSORB or fewer behind takes them too, so the last
    // click is never a lone "Show 1 older". Never folded while searching, or
    // for the section a link opens; a picked filter folds by the FOCUS_
    // numbers below instead.
    var PREVIEW = 3, STEP = 5, MIN_HIDDEN = 1, ABSORB = 2;
    // With ONE section's filter picked, the visitor asked for that section, so
    // it shows FOCUS_PREVIEW and grows by FOCUS_STEP: about two screens at a
    // time (measured: a Shipped item averages ~100px on a laptop, ~140px on a
    // phone), so a long Shipped never dumps everything.
    var FOCUS_PREVIEW = 15, FOCUS_STEP = 15;
    var FORM = "https://forms.gle/CzXE25WRtJnXWE1U9";

    var data, filter = "all", query = "", limits = {}; // section key → items shown (default PREVIEW)
    var pinned = null; // the item a visitor arrived for by link, shown past the fold; cleared once they filter or search
    var topSpacer = 0; // px added above the page so a first item could be centred
    var tails = {};    // section key → items shown AFTER the pinned item ("Show N older" below it)
    var fresh = null;  // {key, from, to}: the items the last click revealed, opened smoothly by render()
    var $ = function (id) { return document.getElementById(id); };

    function el(tag, attrs, kids) {
      var n = document.createElement(tag);
      if (attrs) for (var k in attrs) {
        if (k === "class") n.className = attrs[k];
        else if (k === "text") n.textContent = attrs[k];
        else if (k === "style") n.setAttribute("style", attrs[k]);
        else n.setAttribute(k, attrs[k]);
      }
      (kids || []).forEach(function (c) { if (c != null) n.append(c); });
      return n;
    }
    function hue(status) { return "--hue: var(--" + status + ")"; }

    // Dates are calendar facts ("2026-09"), not instants: format in UTC so a
    // visitor west of Greenwich does not see the previous month.
    function parseDate(s) {
      var p = String(s).split("-").map(Number);
      return new Date(Date.UTC(p[0], (p[1] || 1) - 1, p[2] || 1));
    }
    function fmt(s, withDay) {
      var opts = { month: withDay ? "short" : "long", year: "numeric", timeZone: "UTC" };
      if (withDay && String(s).split("-").length === 3) opts.day = "numeric";
      return parseDate(s).toLocaleDateString("en-US", opts);
    }

    // [text](url) → link; everything else stays text. Only http(s) and
    // site-relative targets are honoured.
    var LINK = /\[([^\]]+)\]\(((?:https?:\/\/|\/(?!\/))[^)\s]+)\)/g;
    function rich(text) {
      var out = [], last = 0, m;
      LINK.lastIndex = 0;
      while ((m = LINK.exec(text))) {
        if (m.index > last) out.push(text.slice(last, m.index));
        var a = el("a", { href: m[2], text: m[1] });
        if (/^https?:/.test(m[2])) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
        out.push(a);
        last = LINK.lastIndex;
      }
      if (last < text.length) out.push(text.slice(last));
      return out;
    }

    function matches(item) {
      if (!query) return true;
      var hay = (item.title + " " + item.body + " " + (item.credit || "") + " " +
        SECT[item.status].label).toLowerCase();
      return query.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
    }

    var COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l2.12-2.12a3 3 0 0 0-4.24-4.24l-.7.7"/><path d="M9.5 6.5a3 3 0 0 0-4.24 0L3.14 8.62a3 3 0 0 0 4.24 4.24l.7-.7"/></svg>';
    var DONE_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>';

    function renderItem(item) {
      // A faint signature under the description, and ONLY when someone is
      // credited by name ("Thanks to Lily H."). Anonymous feedback shows
      // nothing: a line that says "through feedback" competes with the
      // description and tells the reader nothing they act on. The date fades
      // in beside the signature on hover.
      var by = null;
      if (item.credit) {
        // One phrase for every section. A verb chosen by section ("Reported
        // by" for a known issue) would silently change when the fix ships
        // and the item moves to Shipped; a credit should never change.
        var who = "Thanks to " + item.credit;
        var extra = item.status === "shipped" && item.shipped ? "shipped " + fmt(item.shipped, true) : item.date ? fmt(item.date) : "";
        by = el("p", { class: "by" }, [who, extra ? el("span", { class: "extra", text: " · " + extra }) : null]);
      }

      var copy = el("button", { class: "copy", type: "button", title: "Copy a link to this", "aria-label": "Copy a link to " + item.title });
      copy.innerHTML = COPY_ICON; // static icon markup, never item data
      copy.addEventListener("click", function () {
        var url = location.origin + location.pathname + "#" + item.id;
        var done = function () {
          copy.innerHTML = DONE_ICON; copy.classList.add("done"); copy.title = "Copied";
          setTimeout(function () { copy.innerHTML = COPY_ICON; copy.classList.remove("done"); copy.title = "Copy a link to this"; }, 1600);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { location.hash = item.id; });
        else location.hash = item.id;
      });

      var paras = String(item.body).split(/\n\s*\n/).map(function (p) { return el("p", null, rich(p.trim())); });
      return el("li", { class: "item", id: item.id, style: hue(item.status) },
        [el("h3", { text: item.title }), copy].concat(paras, [by]));
    }

    function groupFor(status) {
      return data.items.filter(function (i) { return i.status === status; });
    }

    function render() {
      var root = $("list");
      root.textContent = "";
      var total = 0;

      ORDER.forEach(function (status) {
        if (filter !== "all" && filter !== status) return;
        var all = groupFor(status);
        var shown = all.filter(matches);
        if (!shown.length) return;
        total += shown.length;

        var meta = SECT[status];
        var sec = el("section", { "aria-labelledby": "h-" + status }, [
          el("header", null, [
            el("h2", { id: "h-" + status }, [
              el("span", { class: "dot", style: hue(status) }),
              meta.label,
              el("span", { class: "n", text: String(shown.length) })
            ]),
            query ? null : el("p", { class: "blurb", text: meta.blurb })
          ])
        ]);

        // The focused view keeps its own count, so unfolding there and in
        // "All" never fight over one number.
        var focused = filter === status;
        var key = focused ? status + ":focus" : status;
        var step = focused ? FOCUS_STEP : STEP;
        var limit = limits[key] || (focused ? FOCUS_PREVIEW : PREVIEW);
        // "older" for Shipped, which is sorted by date: a month cut part-way
        // then reads as a list that continues, not a month that is complete.
        var below = status === "shipped" ? " older" : " more";
        // A step that would leave a tiny remainder takes it too.
        var nextOf = function (h) { return h - step <= ABSORB ? h : step; };
        var moreBtn = function (n, word, act) {
          var b = el("button", { class: "more", type: "button", text: "Show " + n + word });
          b.addEventListener("click", function () { act(); render(); });
          return b;
        };

        // Items grouped as the page shows them: Shipped under month labels
        // (a label, not a heading: items are h3 under the section's h2).
        // `st` carries the current month across calls, so a run continues its
        // month instead of repeating the label.
        var groupInto = function (parent, items, st) {
          if (!items.length) return;
          if (status !== "shipped") { parent.append(el("ol", { class: "items" }, items.map(renderItem))); return; }
          var ol = null;
          items.forEach(function (item) {
            var m = String(item.shipped).slice(0, 7);
            if (m !== st.month) { st.month = m; parent.append(el("p", { class: "month", text: fmt(m) })); ol = null; }
            if (!ol) { ol = el("ol", { class: "items" }); parent.append(ol); }
            ol.append(renderItem(item));
          });
        };
        // shown[from..to), with the items the last click revealed wrapped in a
        // .fresh box that opens smoothly (see the end of render()).
        var appendRange = function (from, to, st) {
          if (to <= from) return;
          var f = fresh && fresh.key === key ? fresh : null;
          var a = f ? Math.max(from, Math.min(to, f.from)) : to;
          var c = f ? Math.max(a, Math.min(to, f.to)) : to;
          groupInto(sec, shown.slice(from, a), st);
          if (c > a) { var box = el("div", { class: "fresh" }); groupInto(box, shown.slice(a, c), st); sec.append(box); }
          groupInto(sec, shown.slice(c, to), st);
        };

        var st = { month: null };
        var at = !query && pinned && pinned.status === status ? shown.indexOf(pinned) : -1;
        var tail = tails[key] || 0;
        if (at >= limit) {
          // The item a visitor arrived for sits past the fold. Rather than
          // unfold everything above it, show it right after the visible ones,
          // with each button WHERE its items will appear: "Show N more" in the
          // gap above it (those are newer, so not "older"), and "Show N older"
          // below it only for what is older still. In Shipped the item keeps
          // its own month label, so the skipped time shows.
          appendRange(0, limit, st);
          var gap = at - limit;
          if (gap > 0) {
            var g = nextOf(gap);
            sec.append(moreBtn(g, " more", function () { fresh = { key: key, from: limit, to: limit + g }; limits[key] = limit + g; }));
            st.month = null; // the item's month label always shows after the gap
          }
          appendRange(at, at + 1 + tail, st);
          var rest = shown.length - (at + 1 + tail);
          if (rest > 0) {
            var r = nextOf(rest);
            sec.append(moreBtn(r, below, function () { fresh = { key: key, from: at + 1 + tail, to: at + 1 + tail + r }; tails[key] = tail + r; }));
          }
        } else {
          // Gap closed (or no linked item here): keep everything already shown.
          if (at >= 0) limit = Math.max(limit, at + 1 + tail);
          var fold = !query && shown.length - limit >= MIN_HIDDEN;
          appendRange(0, fold ? limit : shown.length, st);
          if (fold) {
            var n = nextOf(shown.length - limit);
            sec.append(moreBtn(n, below, function () { fresh = { key: key, from: limit, to: limit + n }; limits[key] = limit + n; }));
          }
        }
        root.append(sec);
      });

      if (!total) {
        var a = el("a", { href: FORM, target: "_blank", rel: "noopener noreferrer", text: "Tell us about it" });
        root.append(el("div", { class: "empty" }, [
          el("p", { text: query ? "Nothing here matches “" + $("q").value.trim() + "”." : "Nothing here yet." }),
          el("p", null, ["Not on the list? ", a, "."])
        ]));
      }
      $("status").textContent = query ? total + (total === 1 ? " result" : " results") : "";

      // Items a click just revealed open smoothly where the button was, so
      // whatever sits below (the linked item, in the gap case) glides down
      // instead of jumping. Height is released afterwards so nothing is ever
      // left clipped; under reduced motion the transition is simply skipped.
      fresh = null;
      // Clipping is ONLY for the opening itself: the copy-link button sits
      // just outside each item's right edge, so a box left clipping cut it off.
      [].forEach.call(root.querySelectorAll(".fresh"), function (box) {
        var h = box.scrollHeight;
        box.style.overflow = "hidden"; box.style.height = "0px"; box.style.opacity = "0";
        void box.offsetHeight;
        box.style.transition = "height 0.6s cubic-bezier(0.6, 0, 0.4, 1), opacity 0.6s ease";
        box.style.height = h + "px"; box.style.opacity = "1";
        setTimeout(function () { box.style.height = ""; box.style.overflow = ""; box.style.transition = ""; }, 700);
      });
    }

    function renderChips() {
      var chips = $("chips");
      chips.textContent = "";
      var opts = [["all", "All", data.items.length]].concat(ORDER.map(function (s) {
        return [s, SECT[s].label, data.items.filter(function (i) { return i.status === s; }).length];
      }));
      opts.forEach(function (o) {
        if (o[0] !== "all" && !o[2]) return;
        var b = el("button", { class: "chip", type: "button", "aria-pressed": String(filter === o[0]) }, [
          o[0] === "all" ? null : el("span", { class: "dot", style: hue(o[0]) }),
          o[1],
          el("span", { class: "n", text: String(o[2]) })
        ]);
        b.addEventListener("click", function () { setFilter(o[0]); });
        chips.append(b);
      });
      fadeChips();
    }

    // Fade the right edge only while there is more row to scroll to.
    function fadeChips() {
      var c = $("chips");
      c.classList.toggle("overflow", c.scrollLeft + c.clientWidth < c.scrollWidth - 1);
    }
    $("chips").addEventListener("scroll", fadeChips, { passive: true });
    window.addEventListener("resize", fadeChips);

    function setFilter(f, quiet) {
      filter = f;
      pinned = null;
      var url = new URL(location.href);
      if (f === "all") url.searchParams.delete("show"); else url.searchParams.set("show", f);
      if (!quiet) url.hash = "";
      history.replaceState(null, "", url);
      renderChips(); render();
    }

    // Arriving by a link to one item: show THAT item alone, centred and solid,
    // with "See full roadmap" under it. The rest of the page fades in
    // around it, nearest first, when they press that button or SCROLL (they
    // want more, and blank space would look broken; keyboard scrolling counts,
    // so keys need no rule of their own). No timer, no mouse movement, no other
    // key: those would be premature. It waits for them. Nothing moves: the item is already in its final place,
    // so it never jumps while being read. Only on arrival (a hash change
    // inside the page just scrolls), and never under reduced motion.
    function spotlight(node, placedY, item) {
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var others = [].slice.call(document.querySelectorAll(
        ".wrap > .home, .wrap > h1, .wrap > .lede, .wrap > .aside, .wrap > .problems, " +
        "#toolbar, footer.end, #list section > header, #list .month, #list .item, #list .more"))
        .filter(function (e) { return e !== node; });
      // Hidden means hidden to the pointer too: an invisible item's link or
      // copy button must not catch a click in what looks like empty space.
      others.forEach(function (e) { e.style.transition = "none"; e.style.opacity = "0"; e.style.pointerEvents = "none"; e.setAttribute("aria-hidden", "true"); });
      // The real heading, copied exactly (description included: it is what
      // explains "Planned" or "Maybe", and the copy must look identical to
      // the heading it becomes; only the count is hidden, in CSS), minus ids
      // (the page keeps one of each) and the hiding the spotlight has already
      // put on the original. Plus the month label for a Shipped item.
      var realHead = node.closest("section").querySelector("header").cloneNode(true);
      realHead.removeAttribute("style"); realHead.removeAttribute("aria-hidden");
      [].forEach.call(realHead.querySelectorAll("[id]"), function (e) { e.removeAttribute("id"); });
      var label = el("div", { class: "spot-head", "aria-hidden": "true" }, [realHead,
        item.status === "shipped" && item.shipped ? el("p", { class: "month", text: fmt(String(item.shipped).slice(0, 7)) }) : null]);
      node.append(label);
      // The home link, copied into the corner where it sits on a normal visit
      // (its place at scroll 0, minus any space added above to centre a
      // first item), so it shows whatever the page's scroll.
      var realHome = document.querySelector(".wrap > .home"), home = null;
      if (realHome) {
        var hr = realHome.getBoundingClientRect();
        home = realHome.cloneNode(true);
        home.removeAttribute("style"); home.removeAttribute("aria-hidden");
        home.classList.add("spot-home");
        home.style.left = hr.left + "px";
        home.style.top = (hr.top + window.scrollY - topSpacer) + "px";
        document.body.append(home);
        // Register its hidden starting state before the page's fade begins
        // (same tick), or there is nothing for the fade to start from.
        void home.offsetWidth;
      }
      var btn = el("button", { class: "see-all", type: "button" }, ["See full roadmap"]);
      btn.addEventListener("click", reveal);
      node.append(btn);
      var done = false;
      // A scroll counts only if the page actually moved away from where we put
      // the item: our own centring, the browser settling, or anything else that
      // happened before or during load can never reveal the page. A wheel or a
      // touch drag only ever comes from a person, so those count directly.
      function onScroll() { if (Math.abs(window.scrollY - placedY) > 8) reveal(); }
      function listen(on) {
        var f = on ? "addEventListener" : "removeEventListener", o = { passive: true };
        window[f]("wheel", reveal, o); window[f]("touchmove", reveal, o); window[f]("scroll", onScroll, o);
      }
      function reveal() {
        if (done) return; done = true;
        listen(false);
        btn.classList.add("gone"); label.classList.add("gone"); if (home) home.classList.add("gone");
        setTimeout(function () { btn.remove(); label.remove(); if (home) home.remove(); }, 450);
        var r0 = node.getBoundingClientRect(), mid = r0.top + r0.height / 2;
        others.forEach(function (e) {
          var r = e.getBoundingClientRect();
          var delay = Math.min(Math.abs(r.top + r.height / 2 - mid) / innerHeight, 1) * 0.5;
          e.style.transition = "opacity 0.8s cubic-bezier(0.6, 0, 0.4, 1) " + delay.toFixed(2) + "s";
          e.style.opacity = "";
          e.style.pointerEvents = "";
          e.removeAttribute("aria-hidden");
        });
        setTimeout(function () { others.forEach(function (e) { e.style.transition = ""; }); }, 1600);
      }
      listen(true);
    }

    // A link to one item (#id) must land on it whatever the page was doing:
    // clear whatever would hide it, then point at it. Arriving by link (a
    // reply to feedback) the page keeps its normal short form and the item is
    // PINNED just past its section's fold; a link followed inside the page
    // unfolds the section to it, in order, as before.
    function goToHash(arriving) {
      var id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      var item = data.items.filter(function (i) { return i.id === id; })[0];
      if (!item) return;
      if ((filter !== "all" && filter !== item.status) || query) {
        filter = "all"; query = ""; $("q").value = "";
        var url = new URL(location.href); url.searchParams.delete("show");
        history.replaceState(null, "", url);
        renderChips();
      }
      if (arriving === true) {
        pinned = item;
      } else {
        limits[item.status] = Infinity; // a linked item is never folded away
        limits[item.status + ":focus"] = Infinity;
      }
      render();
      var node = $(id);
      if (!node) return;
      // Arriving by link the toolbar is hidden (spotlight), so the item goes in
      // the exact middle of the screen. Inside the page the toolbar is there,
      // and scrollIntoView centres it in the space below it (scroll-padding).
      var placedY = null;
      if (arriving === true) {
        // Exact centre even for an item near the page's start or end: add just
        // the empty space the page lacks, above or below. It stays for this
        // visit, because removing it would move the item, the one thing this
        // view promises not to do.
        var r = node.getBoundingClientRect();
        var want = r.top + window.scrollY - (window.innerHeight - r.height) / 2;
        if (want < 0) {
          var wrap = document.querySelector(".wrap");
          wrap.style.paddingTop = (parseFloat(getComputedStyle(wrap).paddingTop) - want) + "px";
          topSpacer = -want;
          want = 0;
        }
        var maxY = document.documentElement.scrollHeight - window.innerHeight;
        if (want > maxY) document.body.style.paddingBottom = (want - maxY) + "px";
        window.scrollTo(0, want);
        placedY = window.scrollY;
      } else {
        node.scrollIntoView({ block: "center" });
      }
      if (arriving === true) spotlight(node, placedY, item);
    }

    function boot(json) {
      data = json;
      data.sections.forEach(function (s) { ORDER.push(s.key); SECT[s.key] = s; });
      // An unknown status renders nowhere, which is how an item gets lost.
      // The build refuses one; this keeps a bad edit visible regardless.
      data.items.forEach(function (i) { if (!SECT[i.status]) console.warn("roadmap: unknown status", i.id, i.status); });
      // Files with a mistake are left off the page. Only the dev server sends
      // `problems`, so this banner is for whoever is editing, never a visitor.
      if (data.problems && data.problems.length) {
        $("toolbar").before(el("div", { class: "problems" }, [
          el("strong", { text: data.problems.length + " roadmap file(s) left off this page until fixed:" }),
          el("ul", null, data.problems.map(function (p) {
            return el("li", null, [el("code", { text: "roadmap/" + p.file }), " " + p.errors.join("; ")]);
          }))
        ]));
      }
      var show = new URL(location.href).searchParams.get("show");
      if (show && SECT[show]) filter = show;
      $("toolbar").hidden = false;
      if (data.updated) $("updated").textContent = "Updated " + fmt(data.updated, true);
      renderChips(); render();
      if (location.hash) goToHash(true);
      revealPage(); // only now, with the item already in place
    }

    // Ends the hidden-until-scrolled state the <head> script starts for a
    // link to one item. Safe to call when it never started.
    function revealPage() {
      document.documentElement.classList.remove("deeplink");
      document.documentElement.classList.add("ready");
    }

    var timer;
    $("q").addEventListener("input", function (e) {
      clearTimeout(timer);
      timer = setTimeout(function () { query = e.target.value.trim().toLowerCase(); pinned = null; render(); }, 80);
    });
    $("q").addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.target.value = ""; query = ""; render(); e.target.blur(); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "/" && document.activeElement !== $("q") && !e.metaKey && !e.ctrlKey) {
        e.preventDefault(); $("q").focus();
      }
    });
    window.addEventListener("hashchange", goToHash);

    // A hairline under the toolbar only once it is actually stuck.
    var sentinel = el("div", { style: "height:1px" });
    $("toolbar").before(sentinel);
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (es) {
        $("toolbar").classList.toggle("stuck", !es[0].isIntersecting);
      }).observe(sentinel);
    }

    fetch("/roadmap.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(boot)
      .catch(function () {
        revealPage();
        $("list").textContent = "";
        $("list").append(el("div", { class: "empty" }, [
          el("p", { text: "The roadmap could not load." }),
          el("p", null, ["Try again in a moment, or read ", el("a", { href: "/roadmap.json", text: "the raw list" }), "."])
        ]));
      });
  })();
  </script>
</body>
</html>
