# NU Map MCP server — Cloudflare Worker.
#
# Deploy:  npx wrangler deploy          (from this directory, after wrangler login)
# Domain:  dashboard → this worker → Settings → Domains & Routes → add mcp.numap.app
# Then set VITE_MCP_SERVER_URL=https://mcp.numap.app in Cloudflare Pages →
# nu-map → Settings → Environment variables, and redeploy the site.

name = "numap-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Where the scraped data JSONs are fetched from (the deployed site serves
# them: catalog-courses, term-history, term-details, offering-summary,
# subject-colleges, programs-bundle, data-meta).
[vars]
# GitHub raw, NOT numap.app: the zone's bot protection challenges non-browser
# clients, which includes this worker's own data subrequests (observed
# 2026-07-26: every authenticated MCP call 500'd with "Could not load catalog").
# The files are identical — Pages deploys and this URL both track main.
DATA_ORIGIN = "https://raw.githubusercontent.com/nayugu/nu-map/main/public"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

# OAuth token/client storage for @cloudflare/workers-oauth-provider
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "4a12f332a27146c9996769ebc5e6f837"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]
