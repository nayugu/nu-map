# NU Map MCP server — Cloudflare Worker.
#
# Deploy:  npx wrangler deploy          (from this directory, after wrangler login)
# Domain:  dashboard → this worker → Settings → Domains & Routes → add mcp.numap.app
# Then set VITE_MCP_SERVER_URL=https://mcp.numap.app in Cloudflare Pages →
# nu-map → Settings → Environment variables, and redeploy the site.

name = "numap-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Where the scraped data JSONs are fetched from (the deployed site serves
# them: catalog-courses, term-history, term-details, offering-summary,
# subject-colleges, programs-bundle, data-meta).
[vars]
# Back home on numap.app (2026-08-03): the zone's Human Verification rule
# now exempts /northeastern/ (and /assets/, and verified crawlers), so the
# worker's own data subrequests pass again. The 2026-07-26 breakage — every
# authenticated MCP call 500ing with "Could not load catalog" — was that
# rule challenging non-browser clients; GitHub raw was the workaround.
# If MCP catalog loads ever 500 again, check the zone rule FIRST.
DATA_ORIGIN = "https://numap.app"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

# Share-by-code coat check (one global instance; shares live ≤ 10 min).
# Kill switch: define SHARE_DISABLED (any value) under [vars] or in the
# dashboard to 503 the /share and /claim routes without a deploy.
[[durable_objects.bindings]]
name = "SHAREBOX"
class_name = "ShareBoxDO"

# OAuth token/client storage for @cloudflare/workers-oauth-provider
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "4a12f332a27146c9996769ebc5e6f837"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareBoxDO"]
