<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NU Map — Under maintenance</title>
    <!-- Served with HTTP 503 by functions/index.js, which is what actually keeps
         this page out of the index (see docs/maintenance.md). `noindex` is here
         for the MANUAL escalation path, where a `_redirects` rewrite serves this
         file at status 200 — the one case where a crawler could otherwise take
         it for our content. -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      ═══════════════════════════════════════════════════════════════
      NU MAP — MAINTENANCE PAGE
      ═══════════════════════════════════════════════════════════════

      SELF-CONTAINED, and that is a hard requirement rather than a preference:
      this page exists precisely for the moments when the rest of the deployment
      is not answering, so anything it needs from a server is something that can
      take it down with the thing it is apologising for. So:

        • no stylesheet, no webfont, no <img> — the CSS is inline, the mark is
          inline SVG geometry (the same ribbon the recovery screen in index.html
          draws) and the type is the system stack. One request, no dependencies,
          and it still renders with JavaScript disabled.
        • no call to the app, the MCP worker, the health beacon, or any API.
        • one request, 7.2 KB gzipped (17 KB raw, most of it this commentary),
          so it arrives on a bad connection.

      The ETA degrades through three tiers, in this order:
        1. `__NUMAP_MAINT__` below, substituted by the edge function at serve
           time. Zero requests.
        2. a fetch of /maintenance.json — a STATIC asset on the same edge, not
           an API. Used when this file is served directly.
        3. nothing time-specific. "We'll be back shortly", and the page still
           tells the reader the thing that matters most: their plans are in
           their own browser and are not involved.

      Eight locales inline, deliberately duplicated rather than imported — this
      file must not depend on a bundle. Same convention, and the same short-
      string treatment, as the recovery screen in index.html.
    -->
    <style>
      :root {
        --bg: #fefefe; --fg: #1e293b; --dim: #64748b; --faint: #94a3b8;
        --card: #ffffff; --line: #e2e8f0; --red: #ef4444;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117; --fg: #e2e8f0; --dim: #8b949e; --faint: #6e7681;
          --card: #161b22; --line: #21262d;
        }
      }
      html.dark {
        --bg: #0d1117; --fg: #e2e8f0; --dim: #8b949e; --faint: #6e7681;
        --card: #161b22; --line: #21262d;
      }
      html.light {
        --bg: #fefefe; --fg: #1e293b; --dim: #64748b; --faint: #94a3b8;
        --card: #ffffff; --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; overflow: hidden;
      }
      #petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
      #card { position: relative; width: 100%; max-width: 420px; }
      #mark { width: 84px; height: 84px; margin: 0 auto 12px; display: block; }
      /* 16px, not 4: at 4 the sweeping bar below drew across the heading's
         descenders and read as a strikethrough. */
      h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 16px; }
      #brand {
        font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--faint); margin: 0 0 14px;
      }
      #bar {
        width: 220px; height: 4px; border-radius: 99px; overflow: hidden;
        background: var(--line); margin: 0 auto 18px;
      }
      #bar > i {
        display: block; width: 38%; height: 100%; border-radius: 99px;
        background: var(--red); animation: sweep 1.6s ease-in-out infinite;
      }
      #eta { font-size: 14px; font-weight: 700; margin: 0 0 3px; }
      #at { font-size: 11px; color: var(--faint); margin: 0 0 16px; min-height: 14px; }
      #safe {
        font-size: 12px; color: var(--dim); line-height: 1.7; margin: 0 auto 18px;
        max-width: 360px;
      }
      #acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        appearance: none; font: inherit; font-size: 12px; font-weight: 700;
        padding: 8px 14px; border-radius: 7px; cursor: pointer;
        text-decoration: none; border: 1px solid var(--line);
        background: var(--card); color: var(--fg);
      }
      a.btn.primary { border-color: var(--red); color: var(--red); }
      a.btn:hover { border-color: var(--red); }
      @keyframes sweep { from { transform: translateX(-100%) } to { transform: translateX(263%) } }
      @keyframes fall { from { transform: translateY(-8vh) } to { transform: translateY(112vh) } }
      @keyframes sway {
        from { transform: translateX(-9px) rotate(-38deg) }
        to   { transform: translateX(9px)  rotate(38deg) }
      }
      @media (prefers-reduced-motion: reduce) {
        #bar > i { animation: none }
        #petals { display: none }
      }
    </style>
  </head>
  <body>
    <!-- Brand: the logo's red, the ribbon mark and a petal drift — the same
         three things the recovery screen uses, so a reader who has seen one
         recognises the other. Six petals rather than fourteen: this page has a
         weight budget the in-app screen does not. -->
    <div id="petals" aria-hidden="true"></div>

    <main id="card">
      <!-- The actual NU Map mark, traced as two polygons rather than loaded from
           /logo.png. Not pedantry: the PNG is 132 KB, which is thirteen times
           this whole page and the opposite of "loads instantly on a bad
           connection". Pure geometry costs ~300 bytes and cannot 404. Colour is
           #ef4444, the same brand red index.html's recovery screen uses. -->
      <svg id="mark" viewBox="0 0 880 880" aria-hidden="true">
        <polygon points="272,175 420,175 512,505 380,505 335,375 178,715 32,715" fill="#ef4444" />
        <polygon points="700,178 860,178 600,718 408,718" fill="#ef4444" />
      </svg>

      <p id="brand">NU Map</p>
      <!-- Written into the markup, not only by script: with JS off or blocked
           this page still says what it is. The script only refines it. -->
      <h1 id="title">Under maintenance</h1>

      <div id="bar" aria-hidden="true"><i></i></div>

      <p id="eta">We’ll be back shortly.</p>
      <p id="at"></p>
      <p id="safe">Your plans are saved in this browser, not on our servers — nothing here is lost or changed.</p>

      <div id="acts">
        <!-- GRACEFUL DEGRADATION, and the reason the 503 is honest rather than
             obstructive: a crawler gets "service unavailable", a person who asks
             gets through. `nomaint=1` is what the edge function looks for. Plans
             are in this browser and the catalog is a static file, so the app
             genuinely works while we are working — there is no server for it to
             miss. Removed by the script when the window is `hardBlock`, the one
             case (a storage migration) where continuing to edit would write into
             a schema about to be replaced. -->
        <a id="go" class="btn primary" rel="nofollow" href="/?nomaint=1">Continue anyway</a>
        <a id="again" class="btn" rel="nofollow" href="/">Check again</a>
      </div>
    </main>

    <script>
      /* Substituted by functions/index.js. Left as the literal token when this
         file is served directly, which is how tier 2 below knows to fetch. */
      var INJECTED = "__NUMAP_MAINT__";

      (function () {
        var S = {
          en: { t: "Under maintenance", e: "Back {w}", u: "We’ll be back shortly.", s: "Your plans are saved in this browser, not on our servers — nothing here is lost or changed.", g: "Continue anyway", a: "Check again", h: "This page checks by itself and returns on its own.", o: "This is taking longer than we expected. We’ll be back as soon as we can." },
          es: { t: "En mantenimiento", e: "Volvemos {w}", u: "Volveremos en breve.", s: "Tus planes se guardan en este navegador, no en nuestros servidores: no se pierde ni se modifica nada.", g: "Continuar de todos modos", a: "Volver a comprobar", h: "Esta página se comprueba sola y vuelve por sí misma.", o: "Está tardando más de lo que esperábamos. Volveremos en cuanto podamos." },
          fr: { t: "Maintenance en cours", e: "De retour {w}", u: "Nous revenons très bientôt.", s: "Vos plans sont enregistrés dans ce navigateur, pas sur nos serveurs : rien n’est perdu ni modifié.", g: "Continuer quand même", a: "Réessayer", h: "Cette page se vérifie et revient d’elle-même.", o: "Cela prend plus de temps que prévu. Nous revenons dès que possible." },
          ar: { t: "تحت الصيانة", e: "نعود {w}", u: "سنعود قريبًا.", s: "خططك محفوظة في هذا المتصفّح وليست على خوادمنا — لم يضع أو يتغير شيء.", g: "المتابعة على أي حال", a: "تحقّق مرة أخرى", h: "تتحقّق هذه الصفحة بنفسها وتعود تلقائيًا.", o: "الأمر يستغرق وقتًا أطول مما توقّعنا. سنعود في أقرب وقت ممكن." },
          hi: { t: "रखरखाव जारी है", e: "{w} वापसी", u: "हम जल्द लौटेंगे।", s: "आपकी योजनाएँ इसी ब्राउज़र में सहेजी जाती हैं, हमारे सर्वर पर नहीं — कुछ भी खोता या बदलता नहीं है।", g: "फिर भी जारी रखें", a: "पुनः जाँचें", h: "यह पेज स्वयं जाँच करता है और अपने आप लौट आता है।", o: "इसमें अपेक्षा से अधिक समय लग रहा है। हम जल्द से जल्द लौटेंगे।" },
          ja: { t: "メンテナンス中", e: "復旧は{w}", u: "まもなく戻ります。", s: "プランはこのブラウザに保存されています。サーバーにはないので、失われたり変わったりすることはありません。", g: "それでも続ける", a: "再確認", h: "このページは自動で確認し、復旧すると自動で戻ります。", o: "予定より時間がかかっています。できるだけ早く復旧します。" },
          ko: { t: "점검 중", e: "{w} 복구 예정", u: "곧 돌아오겠습니다.", s: "플랜은 이 브라우저에 저장되며 서버에는 없습니다 — 사라지거나 바뀌지 않습니다.", g: "그래도 계속하기", a: "다시 확인", h: "이 페이지는 스스로 확인하여 복구되면 자동으로 돌아옵니다.", o: "예상보다 오래 걸리고 있습니다. 가능한 한 빨리 돌아오겠습니다." },
          zh: { t: "系统维护中", e: "预计{w}恢复", u: "我们很快就回来。", s: "你的方案保存在这个浏览器里，不在我们的服务器上 — 不会丢失，也不会被修改。", g: "仍然继续", a: "再试一次", h: "本页会自行检查，并在恢复后自动返回。", o: "耗时比预期更长，我们会尽快恢复。" }
        };

        function pick() {
          var lc = "en";
          try { lc = (localStorage.getItem("ncp-locale") || navigator.language || "en").slice(0, 2); } catch (e) {}
          return S[lc] ? lc : "en";
        }
        var lc = pick(), L = S[lc];
        document.documentElement.lang = lc;
        if (lc === "ar") document.documentElement.dir = "rtl";

        // Same theme resolution as index.html's pre-paint script, so this page
        // opens in whatever theme the app was last in rather than flashing.
        try {
          var th = localStorage.getItem("ncp-theme") || localStorage.getItem("map-theme");
          if (th === "dark" || th === "light") document.documentElement.className = th;
        } catch (e) {}

        var $ = function (id) { return document.getElementById(id); };
        $("title").textContent = L.t;
        $("safe").textContent = L.s;
        $("eta").textContent = L.u;
        $("go").textContent = L.g;
        $("again").textContent = L.a;
        $("again").href = "/?t=" + Date.now();

        for (var i = 0; i < 6; i++) {
          var d = document.createElement("div"),
              lft = (i * 83 + 11) % 96, sz = 10 + ((i * 37) % 7),
              dur = 9 + ((i * 53) % 60) / 10, del = -(dur * i / 6),
              col = i % 3 === 0 ? "#ef4444" : i % 3 === 1 ? "#f87171" : "#fca5a5";
          d.style.cssText = "position:absolute;top:0;left:" + lft + "%;animation:fall " + dur + "s linear " + del + "s infinite;";
          d.innerHTML = '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 12 12" style="display:block;opacity:.4;animation:sway ' + (2.4 + i / 5) + 's ease-in-out ' + (del / 2) + 's infinite alternate"><path d="M6 0 C 9.2 2.4, 9.2 7.2, 6 12 C 2.8 7.2, 2.8 2.4, 6 0" fill="' + col + '"/></svg>';
          $("petals").appendChild(d);
        }

        function relative(ms) {
          var abs = Math.abs(ms), unit = "day", v = ms / 864e5;
          if (abs < 9e4) { unit = "second"; v = ms / 1e3; }
          else if (abs < 54e5) { unit = "minute"; v = ms / 6e4; }
          else if (abs < 1296e5) { unit = "hour"; v = ms / 36e5; }
          var n = (v < 0 ? -1 : 1) * Math.max(1, Math.round(Math.abs(v)));
          try { return new Intl.RelativeTimeFormat(lc, { numeric: "always" }).format(n, unit); }
          catch (e) { return n + " " + unit + (Math.abs(n) === 1 ? "" : "s"); }
        }
        function absolute(ms) {
          try {
            return new Intl.DateTimeFormat(lc, {
              weekday: "short", month: "short", day: "numeric",
              hour: "numeric", minute: "2-digit", timeZoneName: "short"
            }).format(new Date(ms));
          } catch (e) { return new Date(ms).toISOString(); }
        }

        var reloads = 0;
        function apply(w) {
          if (!w) return;
          var end = typeof w.end === "number" ? w.end : Date.parse(w.end);
          if (!isFinite(end)) return;
          // `end` is the deadline; `expectedEnd` is what we quote. Once the
          // forecast passes we stop quoting it — a countdown that has visibly
          // run out while the page is still up is the fastest way to look
          // abandoned. The auto-check below still keys off the DEADLINE.
          var eta = w.expectedEnd == null ? end
            : (typeof w.expectedEnd === "number" ? w.expectedEnd : Date.parse(w.expectedEnd));
          if (!isFinite(eta) || eta > end) eta = end;
          if (w.hardBlock) {
            // No hatch, so say what happens instead of leaving a dead end.
            var go = $("go");
            if (go && go.parentNode) go.parentNode.removeChild(go);
            $("safe").textContent = L.s + " " + L.h;
          }
          var tick = function () {
            var now = Date.now();
            if (end - now <= 0) {
              // The deadline is past. Check for real, at most three times, with
              // a widening gap — a page that reloads forever is a worse outage
              // than the one it is reporting, and "Check again" is right there.
              $("eta").textContent = L.u;
              $("at").textContent = "";
              if (reloads++ < 3) setTimeout(function () { location.replace("/?t=" + Date.now()); }, 4000 + reloads * 6000);
              return;
            }
            if (eta - now <= 0) {
              // Overrunning: say so plainly rather than counting down to a time
              // that has gone. No date either — we no longer have a claim to make.
              $("eta").textContent = L.o;
              $("at").textContent = "";
              return;
            }
            $("eta").textContent = L.e.replace("{w}", relative(eta - now));
            $("at").textContent = absolute(eta);
          };
          tick();
          setInterval(tick, 15000);
        }

        // Tier 1: injected at the edge — no request at all. The function
        // replaces the whole quoted token, so what lands here is an OBJECT; the
        // string branch covers a substitution that kept the quotes. Object
        // first, because `.charAt` on an object throws and this must not.
        if (INJECTED && typeof INJECTED === "object") { apply(INJECTED); return; }
        if (typeof INJECTED === "string" && INJECTED.charAt(0) !== "_") {
          try { apply(JSON.parse(INJECTED)); return; } catch (e) {}
        }

        // Tier 2: the static schedule, from the same edge. Not an API — if it is
        // missing, or answers with the SPA shell (see public/_headers), or times
        // out, we simply say less. Never an error the reader has to see.
        try {
          var done = false, timer = setTimeout(function () { done = true; }, 2500);
          fetch("/maintenance.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (txt) {
              clearTimeout(timer);
              if (done || !txt || txt.charAt(0) === "<") return;
              var cfg = JSON.parse(txt), ws = cfg.windows || (cfg.window ? [cfg.window] : []), now = Date.now();
              for (var j = 0; j < ws.length; j++) {
                var s = Date.parse(ws[j].start), e2 = Date.parse(ws[j].end);
                if (isFinite(s) && isFinite(e2) && now >= s && now < e2) { apply(ws[j]); return; }
              }
            })
            .catch(function () {});
        } catch (e) { /* Tier 3: the generic wording already in the markup. */ }
      })();
    </script>
  </body>
</html>
