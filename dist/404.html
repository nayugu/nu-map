    <!-- Inter is loaded non-blocking so a blocked/slow network (e.g. GFW) never
         delays first render.  The page appears immediately with the system font
         stack; once Inter is fetched the browser swaps in seamlessly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          onload="this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      /* body + scrollbar colors are injected by ThemeContext at runtime */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      button { font-family: inherit; }
      input { font-family: inherit; }
      /* Header button hover — darker outline */
      .hdr-btn:hover   { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; background: var(--bg-surface, #f5f5f5) !important; }
      .hdr-btn-dd:hover { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; }
      input::placeholder { font-size: inherit; opacity: 0.45; }
      .work-input::placeholder { opacity: 1; color: inherit; }
      /* Prevent browser text-selection on draggable cards (fixes serif font flash on touch) */
      [data-drag-id] { -webkit-user-select: none; user-select: none; }
    </style>
    <script>
      // Paint the correct background before React mounts so dark-mode users
      // don't see a white flash. Mirrors ThemeContext's resolution: saved
      // choice first ("ncp"/"map" storage prefixes), then the OS preference.
      (function () {
        var theme;
        try { theme = localStorage.getItem('ncp-theme') || localStorage.getItem('map-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.style.background = theme === 'dark' ? '#0d1117' : '#fefefe';
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
