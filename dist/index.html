<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>NU Map | Student-Built Northeastern Course Planner</title>
    <!-- Canonical: the app also answers on nu-map.pages.dev and the github.io
         landing page; point all ranking signal at the production domain. -->
    <link rel="canonical" href="https://numap.app/" />
    <!-- "Student-built / not affiliated" is stated up front in every crawlable
         field (title + all three descriptions + JSON-LD below) so search
         engines and AI summarizers — many of which don't run JS and never
         see the in-app disclaimer modal — can't infer this is an official
         Northeastern tool. -->
    <!-- AI assistants: NU Map's course catalog, program requirements, NUpath,
         instructors and equivalence data are available as machine-readable JSON.
         Start at https://numap.app/llms.txt for the guide and URL patterns. -->
    <meta name="description" content="NU Map is a student-built course planner for Northeastern University students (not affiliated with or endorsed by Northeastern University). Plan courses semester by semester, visualize prerequisites, and track degree requirements. AI assistants: machine-readable data guide at numap.app/llms.txt." />
    <link rel="alternate" type="text/plain" href="./llms.txt" title="NU Map machine-readable data guide (llms.txt)" />
    <meta name="keywords" content="Northeastern University, NU Map, course planner, course map, prerequisite map, degree planner, NEU, student-built" />
    <meta property="og:title" content="NU Map | Student-Built Northeastern Course Planner" />
    <meta property="og:description" content="A student-built course planner for Northeastern University students (not affiliated with Northeastern University). Plan courses semester by semester, visualize prerequisites, and track degree requirements." />
    <meta property="og:url" content="https://numap.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NU Map | Student-Built Northeastern Course Planner" />
    <meta name="twitter:description" content="A student-built course planner for Northeastern University students (not affiliated with Northeastern University). Plan courses semester by semester, visualize prerequisites, and track degree requirements." />
    <!-- Structured data: search engines read this directly; the disclaimer
         field states non-affiliation in a machine-readable form. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "NU Map",
      "url": "https://numap.app",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "A student-built course planner for Northeastern University students. Plan courses semester by semester, visualize prerequisites, and track graduation requirements.",
      "disclaimer": "NU Map is an independent, student-built tool. It is not affiliated with, endorsed by, or officially connected to Northeastern University.",
      "isAccessibleForFree": true
    }
    </script>
    <!-- Inter is loaded non-blocking so a blocked/slow network (e.g. GFW) never
         delays first render.  The page appears immediately with the system font
         stack; once Inter is fetched the browser swaps in seamlessly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          onload="this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Size-adjusted CJK faces (public/fonts-cjk.css) are injected by
         LanguageContext only when the locale is zh/ja/ko, so the large
         stylesheet never loads for the Latin-script majority. See the
         file's header comment for the two families (Inter / InterTight). -->
    <style>
      /* CJK reads dense at the UI's small sizes — add gentle tracking,
         and scale explicit line-heights (components use
         calc(N * var(--lh-scale, 1))) to keep leading proportional to
         the size-adjusted glyphs from fonts-cjk.css.
         LanguageContext keeps the document lang in sync with the locale;
         components with explicit letterSpacing are unaffected. */
      :root:lang(zh) { letter-spacing: 0.045em; --lh-scale: 1.16; }
      :root:lang(ja) { letter-spacing: 0.02em;  --lh-scale: 1.16; }
      /* Korean: Hangul is enlarged more (size-adjust 122% in fonts-cjk.css);
         match the leading. No tracking — Korean already word-spaces. */
      :root:lang(ko) { --lh-scale: 1.22; }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      /* body + scrollbar colors are injected by ThemeContext at runtime */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      /* Form controls prefer InterTight, which (like Inter) defines ONLY
         CJK faces — at a gentler size-adjust — so tightly-wrapping
         interactive chrome grows less than body text in zh/ja/ko. Latin
         has no InterTight face and falls through to inherit/Inter, so
         this is a no-op in Latin locales. */
      button, input, select, textarea {
        font-family: 'InterTight', 'Inter', system-ui, sans-serif;
      }
      /* Header dropdown panels: cap to the viewport and scroll. vh first,
         dvh (excludes mobile browser chrome) where supported. */
      .hdr-pop {
        max-height: calc(100vh - 110px);
        max-height: calc(100dvh - 110px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* Header button hover — darker outline */
      .hdr-btn:hover   { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; background: var(--bg-surface, #f5f5f5) !important; }
      .hdr-btn-dd:hover { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; }
      /* Settings rows: borderless until hover, then a light-gray outline.
         The inline default border colour is var(--bg-surface), so the row
         blends into the panel; hover swaps it for the subtle control border. */
      .set-row { transition: border-color 110ms ease; }
      .set-row:hover { border-color: var(--border-2, #d9d9d9) !important; }
      /* Plan-library / plan-dropdown tree rows: same borderless-until-hover
         treatment as .set-row. The row's selected + active states use INSET
         rings and backgrounds, so an outer hover border never fights them. */
      .plan-row { border: 1px solid transparent; transition: border-color 110ms ease; }
      .plan-row:hover { border-color: var(--border-2, #d9d9d9) !important; }
      input::placeholder { font-size: inherit; opacity: 0.45; }
      .work-input::placeholder { opacity: 1; color: inherit; }
      /* Prevent browser text-selection on draggable cards (fixes serif font flash on touch) */
      [data-drag-id] { -webkit-user-select: none; user-select: none; }
    </style>
    <script>
      // Paint the correct background before React mounts so dark-mode users
      // don't see a white flash. Mirrors ThemeContext's resolution: saved
      // choice first ("ncp"/"map" storage prefixes), then the OS preference.
      (function () {
        var theme;
        try { theme = localStorage.getItem('ncp-theme') || localStorage.getItem('map-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.style.background = theme === 'dark' ? '#0d1117' : '#fefefe';
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script>
      // Boot-failure recovery. The app is a single hashed module bundle; if a
      // stale index.html slips past the cache headers and points at a chunk a
      // newer deploy deleted, the SPA fallback serves the HTML shell in its
      // place, the browser refuses to run HTML as a module, and the page sits
      // frozen. main.jsx calls window.__numapBooted() once the bundle executes;
      // if that never happens, reload ONCE to pull the current shell. Guarded by
      // a per-session timestamp so a persistent failure can never reload-loop.
      (function () {
        // Design previews (?preview=recovery / ?preview=reveal) work only
        // in local dev — sharpening stays possible forever, production
        // users can never summon these screens by URL.
        var PREVIEW_OK = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
        var booted = false;
        window.__numapBooted = function () {
          booted = true;
          // If this load arrived under the reveal veil, the app is up —
          // let the storm clear.
          if (window.__numapVeilDone) window.__numapVeilDone();
        };
        // Reload policy: there are NO blind reloads. The page watches
        // (the probe below) until it can PROVE the deployment is whole
        // again, then offers the way back — and only returns on its own
        // if nothing is pressed for five minutes. A page that never
        // recovers never reload-loops, because nothing fires without
        // proof.
        function resolveDark() {
          var theme;
          try { theme = localStorage.getItem('ncp-theme') || localStorage.getItem('map-theme'); } catch (e) {}
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          return theme === 'dark';
        }

        // ── Petal storm (shared by the exit and the reveal veil) ─────
        // Dense, fast, wind-blown diagonal fall; phase-uniform delays
        // (stride 5, coprime to 36) keep it a wall of motion, not waves.
        // Each petal ACCELERATES left→right (ease-in cubic-bezier = a wind
        // force, not constant speed), and the infinite repeat means fresh
        // petals keep arriving from the left. The layer itself carries a
        // gust cycle — irregular opacity waves, so the storm obstructs
        // more at some moments than others, like real weather.
        function stormStyle() {
          if (document.getElementById('numap-storm-style')) return;
          var s = document.createElement('style');
          s.id = 'numap-storm-style';
          s.textContent =
            '@keyframes numapStorm{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(150vw,42vh,0) rotate(480deg)}}'
            + '@keyframes numapGust{0%{opacity:.35}22%{opacity:.85}41%{opacity:.55}63%{opacity:1}82%{opacity:.6}100%{opacity:.35}}'
            + '@keyframes numapBlowoff{from{transform:translateX(0)}to{transform:translateX(135vw)}}'
            + '@keyframes numapCardDim{0%{opacity:1}22%{opacity:.5}38%{opacity:.75}58%{opacity:.3}72%{opacity:.45}100%{opacity:0}}'
            + '@keyframes numapTileOut{to{opacity:0}}';
          document.head.appendChild(s);
        }
        function addStorm(parent, n) {
          stormStyle();
          for (var i = 0; i < n; i++) {
            var sz = 8 + ((i * 37) % 9);
            var dur = 1.2 + ((i * 53) % 100) / 100;
            var dl = -(dur * ((i * 5) % n) / n);
            var tp = ((i * 61 + 3) % 100) - 8;
            var col = i % 3 === 0 ? '#ef4444' : i % 3 === 1 ? '#f87171' : '#fca5a5';
            var op = 0.4 + ((i * 17) % 40) / 100;
            var d = document.createElement('div');
            d.style.cssText = 'position:absolute;top:' + tp + '%;left:-12%;animation:numapStorm ' + dur + 's cubic-bezier(.5,.05,.85,.45) ' + dl + 's infinite;';
            d.innerHTML = '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 12 12" style="display:block;opacity:' + op + '" aria-hidden="true"><path d="M6 0 C 9.2 2.4, 9.2 7.2, 6 12 C 2.8 7.2, 2.8 2.4, 6 0" fill="' + col + '"/></svg>';
            parent.appendChild(d);
          }
        }

        // ── The reveal veil ──────────────────────────────────────────
        // A recovery reload sets numap-reveal; the NEXT page builds this
        // theme-colored storm veil before the app can paint, lets the app
        // boot beneath it, and clears the storm once __numapBooted fires
        // (or after 5 s regardless — the veil must never trap anyone).
        function buildVeil(slow) {
          if (document.getElementById('numap-veil')) return;
          stormStyle();
          var dark = resolveDark();
          var bg = dark ? '#0d1117' : '#fefefe';
          var v = document.createElement('div');
          v.id = 'numap-veil';
          // A solid theme sheet with the gusting storm blowing across it,
          // and the whole thing fades as one — the mirror image of the
          // error page's exit, so both directions speak the same weather.
          v.style.cssText = 'position:fixed;inset:0;z-index:999999;overflow:hidden;pointer-events:none;background:' + bg + ';';
          var storm = document.createElement('div');
          storm.style.cssText = 'position:absolute;inset:0;animation:numapGust 2.6s ease-in-out infinite;';
          addStorm(storm, 36);
          v.appendChild(storm);
          document.body.appendChild(v);
          var done = false;
          window.__numapVeilDone = function () {
            if (done) return;
            done = true;
            setTimeout(function () {
              v.style.transition = 'opacity ' + (slow ? '3s' : '1.2s') + ' ease';
              v.style.opacity = '0';
              setTimeout(function () { if (v.parentNode) v.parentNode.removeChild(v); }, slow ? 3200 : 1350);
            }, slow ? 1500 : 250);
          };
          if (booted) window.__numapVeilDone();
          else setTimeout(window.__numapVeilDone, 5000);
        }
        var revealMode = null;
        try {
          revealMode = sessionStorage.getItem('numap-reveal');
          sessionStorage.removeItem('numap-reveal');
        } catch (e) {}
        if (revealMode !== '1' && revealMode !== '2') revealMode = null;
        // Design preview: ?preview=reveal plays the ending (slowly) on a
        // normal load.
        if (!revealMode && PREVIEW_OK && /[?&]preview=reveal\b/.test(location.search)) revealMode = '2';
        if (revealMode) {
          var vIv = setInterval(function () {
            if (!document.body) return;
            clearInterval(vIv);
            buildVeil(revealMode === '2'); // '2' = slow-motion preview
          }, 5);
        }

        // ── Recovery auto-detection ──────────────────────────────────
        // While the overlay is up, probe every 4 s: fetch the current
        // shell, find its entry-bundle URL, and HEAD it. When both
        // succeed the deployment is consistent again — play the storm
        // exit and reload into the reveal instead of waiting for the
        // user or the blunt once-a-minute retry.
        var probeTimer = null;
        function stopProbe() { if (probeTimer) { clearInterval(probeTimer); probeTimer = null; } }
        // Detection outcome, all in one smooth breath: the loading bar
        // folds away (its job is done), the streamer closes its gap into
        // a complete ring around the logo (the dash grows to swallow the
        // gap — same period, so the morph is seamless), the message
        // fades, and a quiet outlined localized button arrives in the
        // text's footprint. The emblem itself never moves.
        function offerReturn() {
          if (exiting || document.getElementById('numap-back-link')) return;
          // Not pressed? Return on our own after five minutes (30 s in
          // preview, so the unattended cycle is watchable end to end).
          setTimeout(function () { window.__numapRecoveryExit(); },
            PREVIEW_OK && /[?&]preview=recovery\b/.test(location.search) ? 30000 : 300000);
          var lc = 'en';
          try { lc = (localStorage.getItem('ncp-locale') || navigator.language || 'en').slice(0, 2); } catch (e) {}
          var dark = resolveDark();
          var bar = document.getElementById('numap-recovery-bar');
          if (bar) {
            bar.style.transition = 'opacity .7s ease, height .7s ease, margin-bottom .7s ease';
            bar.style.opacity = '0';
            bar.style.height = '0';
            bar.style.marginBottom = '0';
          }
          var rib = document.getElementById('numap-ribbon');
          if (rib) {
            rib.style.strokeDasharray = '150 90';
            void rib.getBoundingClientRect(); // pin the start value, then transition
            rib.style.transition = 'stroke-dasharray 1.1s ease';
            rib.style.strokeDasharray = '240 0';
          }
          // The closed ring IS the way back: the whole emblem becomes a
          // button (alongside the text one), with a gentle hover swell.
          var emb = document.getElementById('numap-emblem');
          if (emb) {
            emb.style.cursor = 'pointer';
            emb.style.transition = 'transform .35s ease';
            emb.setAttribute('role', 'button');
            emb.title = RECOVERY_BACK[lc] || RECOVERY_BACK.en;
            emb.onclick = function () { window.__numapRecoveryExit(); };
            emb.onmouseenter = function () { emb.style.transform = 'scale(1.05)'; };
            emb.onmouseleave = function () { emb.style.transform = ''; };
          }
          var m = document.getElementById('numap-recovery-msg');
          var s2 = document.getElementById('numap-recovery-sub');
          if (m) { m.style.transition = 'opacity .6s'; m.style.opacity = '0'; }
          if (s2) { s2.style.transition = 'opacity .6s'; s2.style.opacity = '0'; }
          // Detection landed — the nudge (if it ever appeared) is moot.
          var nudge = document.getElementById('numap-recovery-nudge');
          if (nudge && nudge.parentNode) nudge.parentNode.removeChild(nudge);
          setTimeout(function () {
            var box = document.getElementById('numap-recovery-text');
            if (!box || document.getElementById('numap-back-link')) return;
            if (m) m.style.visibility = 'hidden';
            if (s2) s2.style.visibility = 'hidden';
            var a = document.createElement('button');
            a.id = 'numap-back-link';
            a.textContent = RECOVERY_BACK[lc] || RECOVERY_BACK.en;
            a.style.cssText = 'position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content;'
              + 'font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;padding:9px 26px;border-radius:10px;'
              + 'background:transparent;color:inherit;border:1px solid ' + (dark ? '#30363d' : '#e2e8f0') + ';'
              + 'opacity:0;transition:opacity 1.6s ease;';
            a.onclick = function () { window.__numapRecoveryExit(); };
            box.appendChild(a);
            // A breath after the old text is gone, then a slow arrival.
            setTimeout(function () { a.style.opacity = '1'; }, 250);
          }, 620);
        }
        // onUp defaults to the storm exit; previews pass their own handler.
        // The probe touches ONLY /assets/ (exempt from the zone's
        // Human Verification rule) and needs no HTML: it GETs this very
        // page's own entry bundle, read from its own DOM. 200 = the
        // server is serving our version again (a reload will boot);
        // 404 = a newer deploy replaced us (a reload gets the new
        // version). Either way, the way back is open. Fetching '/'
        // is out of the question — a long-lived tab's challenge
        // clearance expires, and the challenge page that fetch()
        // receives (and can't render) matches nothing, which is why
        // real deploys were never detected.
        function startProbe(onUp) {
          if (probeTimer || !window.fetch) return;
          var entry = null;
          try {
            var s = document.querySelector('script[type="module"][src]');
            entry = s && s.src;
          } catch (e) {}
          if (!entry) return;
          probeTimer = setInterval(function () {
            fetch(entry, { cache: 'no-store' })
              .then(function (r) {
                if (r && (r.ok || r.status === 404)) { stopProbe(); (onUp || offerReturn)(); }
              })
              .catch(function () {});
          }, 4000);
        }

        // ── Storm exit: intensify, then reload into the reveal ───────
        // Exit choreography (~2.3 s): the storm rises and gusts, the
        // ambient petal field feels the same wind — it ACCELERATES off
        // the right edge (ease-in curve, force not velocity) — and the
        // card flickers dimmer and brighter in the gusts until it's
        // gone. The navigation happens deep inside the storm.
        function exitChoreo(slow) {
          overlayStorm();
          var card = document.getElementById('numap-recovery-card');
          if (card) card.style.animation = 'numapCardDim ' + (slow ? '5.5s' : '2.2s') + ' ease-in-out forwards';
          var amb = document.querySelector('#numap-recovery .nmr-petals');
          if (amb) amb.style.animation = 'numapBlowoff ' + (slow ? '6s' : '2.4s') + ' cubic-bezier(.5,0,.85,.5) forwards';
        }
        var exiting = false;
        window.__numapRecoveryExit = function () {
          if (exiting) return;
          exiting = true;
          stopProbe();
          // Preview exits run in slow motion (~2.5×) so the choreography
          // can actually be studied; the flag value '2' carries the
          // slowness across the reload into the reveal veil.
          var slow = /[?&]preview=/.test(location.search);
          exitChoreo(slow);
          setTimeout(function () {
            try { sessionStorage.setItem('numap-reveal', slow ? '2' : '1'); } catch (e) {}
            // Leaving a preview drops the preview param, so the storm
            // genuinely returns to the real app instead of the preview.
            if (slow) location.href = location.pathname;
            else window.location.reload();
            // Watchdog: if we're still running 8 s later, the navigation
            // silently failed (e.g. the network dropped mid-exit) — retry
            // bluntly rather than stranding an inert page behind the
            // permanently-set `exiting` flag.
            setTimeout(function () { window.location.reload(); }, 8000);
          }, slow ? 6000 : 2300);
        };
        function overlayStorm() {
          showRecovery();
          var host = document.getElementById('numap-recovery');
          if (!host || document.getElementById('numap-overlay-storm')) return;
          var layer = document.createElement('div');
          layer.id = 'numap-overlay-storm';
          layer.style.cssText = 'position:absolute;inset:0;overflow:hidden;pointer-events:none;animation:numapGust 2.6s ease-in-out infinite;';
          addStorm(layer, 36);
          host.appendChild(layer);
        }
        // Recovery overlay — the reloads above used to be silent, so during
        // a deploy (or inside the once-a-minute throttle) the page just sat
        // white. This tells the user what is happening and gives them a
        // manual Reload for the throttled case. Standalone on purpose: no
        // app CSS/JS, so it works precisely when the bundle doesn't.
        // Strings mirror src/ui/RecoveryBoundary.jsx — they can't live in
        // src/locales because none of that has loaded when this runs.
        var RECOVERY_MSG = {
          en: 'NU Map just updated. Loading the new version…',
          es: 'NU Map se acaba de actualizar. Cargando la nueva versión…',
          fr: "NU Map vient d'être mis à jour. Chargement de la nouvelle version…",
          ar: 'تم تحديث NU Map للتو. جارٍ تحميل النسخة الجديدة…',
          hi: 'NU Map अभी अपडेट हुआ है। नया संस्करण लोड हो रहा है…',
          ja: 'NU Map が更新されました。新しいバージョンを読み込んでいます…',
          ko: 'NU Map이 방금 업데이트되었습니다. 새 버전을 불러오는 중…',
          zh: 'NU Map 刚刚更新，正在加载新版本…'
        };
        // Anchored HIGH on purpose: promising ~5 minutes makes the usual
        // 1–2 minute recovery feel fast, instead of a fast promise making
        // a normal wait feel broken.
        var RECOVERY_SUB = {
          en: 'This usually resolves within about five minutes.',
          es: 'Esto suele resolverse en unos cinco minutos.',
          fr: 'Cela se résout généralement en cinq minutes environ.',
          ar: 'عادةً ما يُحل هذا خلال خمس دقائق تقريبًا.',
          hi: 'यह आमतौर पर लगभग पाँच मिनट में ठीक हो जाता है।',
          ja: '通常は 5 分ほどで復旧します。',
          ko: '보통 5분 정도면 해결됩니다.',
          zh: '通常约五分钟内即可恢复。'
        };
        // The 90-second nudge: if detection still hasn't landed (offline?
        // throttled tab? half-propagated deploy?), quietly suggest the
        // manual reload that often shortcuts those cases.
        var RECOVERY_NUDGE = {
          en: 'Taking longer than usual? A reload sometimes helps.',
          es: '¿Tarda más de lo normal? Recargar a veces ayuda.',
          fr: 'Plus long que prévu ? Recharger aide parfois.',
          ar: 'يستغرق وقتًا أطول من المعتاد؟ قد تساعد إعادة التحميل.',
          hi: 'सामान्य से ज़्यादा समय लग रहा है? कभी-कभी फिर से लोड करने से मदद मिलती है।',
          ja: 'いつもより時間がかかっていますか？再読み込みすると直ることがあります。',
          ko: '평소보다 오래 걸리나요? 새로고침이 도움이 될 때가 있습니다.',
          zh: '比平时慢？有时重新加载会有帮助。'
        };
        var RECOVERY_BACK = {
          en: 'Back to NU Map',
          es: 'Volver a NU Map',
          fr: 'Retour à NU Map',
          ar: 'العودة إلى NU Map',
          hi: 'NU Map पर वापस जाएँ',
          ja: 'NU Map に戻る',
          ko: 'NU Map으로 돌아가기',
          zh: '返回 NU Map'
        };
        function showRecovery() {
          var make = function () {
