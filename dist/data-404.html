<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Not found - NU Map Data</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#1e293b;
      display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
    main{max-width:480px;text-align:center}
    h1{font-size:1.35rem;margin:0 0 .4em}
    p{color:#64748b;font-size:.95rem;margin:.4em 0}
    a{color:#dc2626;text-decoration:none}a:hover{text-decoration:underline}
    ul{list-style:none;padding:0;margin:1em 0}
    li{margin:6px 0}
  </style>
</head>
<body>
  <main>
    <h1>That page doesn't exist</h1>
    <p id="path" style="word-break:break-all"></p>
    <p>The closest pages that do:</p>
    <ul id="near"></ul>
    <p><a href="/data">Data home</a> · <a href="/">numap.app planner</a></p>
  </main>
  <script>
    // Offer every real ancestor of the typed path — /data/courses/MATH/317
    // suggests /data/courses/MATH, then /data/courses. Ancestors are
    // directory pages, so they exist whenever their segment is real.
    var segs = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
    document.getElementById("path").textContent = location.pathname;
    var near = document.getElementById("near");
    for (var i = segs.length - 1; i >= 2; i--) {
      var href = "/" + segs.slice(0, i).join("/");
      var a = document.createElement("a");
      a.href = href; a.textContent = href;
      var li = document.createElement("li");
      li.appendChild(a); near.appendChild(li);
    }
  </script>
</body>
</html>
