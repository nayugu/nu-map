<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nu-map/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>NU Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      /* body + scrollbar colors are injected by ThemeContext at runtime */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      button { font-family: inherit; }
      input { font-family: inherit; }
      /* Header button hover — darker outline */
      .hdr-btn:hover   { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; background: var(--bg-surface, #f5f5f5) !important; }
      .hdr-btn-dd:hover { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; }
      input::placeholder { font-size: inherit; opacity: 0.45; }
      .work-input::placeholder { opacity: 1; color: inherit; }
      /* Prevent browser text-selection on draggable cards (fixes serif font flash on touch) */
      [data-drag-id] { -webkit-user-select: none; user-select: none; }
    </style>
    <script type="module" crossorigin src="/nu-map/assets/index-BbY7CQKH.js"></script>
  </head>
  <body>
    <!-- Register COI service worker so SharedArrayBuffer is available for
         ONNX Runtime's multithreaded WASM.  Only needed on hosts (e.g. GitHub
         Pages) that don't set COOP/COEP headers natively.  The SW intercepts
         responses and injects those headers; a single page reload activates it. -->
    <script>
      if ("serviceWorker" in navigator && !crossOriginIsolated) {
        navigator.serviceWorker.register("./coi-serviceworker.js").then(function (reg) {
          if (!navigator.serviceWorker.controller) {
            // First activation — reload so the SW can serve this page with headers.
            reg.addEventListener("updatefound", function () {
              reg.installing.addEventListener("statechange", function () {
                if (this.state === "activated") location.reload();
              });
            });
          }
        }).catch(function (err) {
          console.warn("[coi-serviceworker] registration failed:", err);
        });
      }
    </script>
    <div id="root"></div>
  </body>
</html>
