name: Update Course Data

# Runs on the 1st of every month at 06:00 UTC.
#
# Every month:
#   1. Scrape catalog.northeastern.edu → catalog-courses.json
#   2. Query nubanner.neu.edu for recent term availability → term-history.json
#   3. Apply manual patches
#
# Pushes directly to main — no PR. Same pattern as update-nupath.yml.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:

# All data workflows share one concurrency group. They each commit straight to
# main, so two running at once means two pushes from stale checkouts and the
# loser's data is silently dropped until the next cycle — two months, for the
# bimonthly majors jobs.
#
# ⚠ The group enforces MUTUAL EXCLUSION. It does not enforce ORDER, and this
# comment used to claim it did. Order follows arrival, and arrival is whenever
# GitHub gets round to the cron: on 2026-09-01 the 06:00, 08:00 and 09:00 jobs
# were delivered at 11:02, 12:52 and 13:47. Nothing stops a majors run arriving
# first, in which case its verifier reads a month-old catalog and reports
# hundreds of "unknown courses" — a loud, recoverable failure whose cause is
# named in that pipeline's alert rather than something silent.
#
# The stagger is now 06:00 / 12:00 / 15:00 rather than 06:00 / 08:00 / 09:00.
# Six hours is nearly four times the longest course run measured (88 minutes on
# 2026-09-01), so the jobs only collide when GitHub's own delivery is hours
# late — and a collision matters: GitHub keeps at most ONE pending run per
# concurrency group and cancels the previous when a third arrives, and a run
# cancelled before it starts executes no steps, so it cannot alert. That is
# what data-staleness.yml watches for from outside.
concurrency:
  group: nu-map-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # the failure alert opens/closes an issue

# ── Naming the shell is what turns pipefail on, and it is load-bearing ───────
#
# Actions' DEFAULT shell on Linux is `bash -e {0}` — with NO pipefail. Every
# step below is written `node scripts/x.js --write 2>&1 | tee /tmp/x-log.txt`,
# so without this the step's exit status is TEE's, and `tee` always succeeds.
#
# That is not a theoretical hole. Counting the refusal paths in the scripts this
# job runs — scrape-catalog 6, fetch-nupath 3, scrape-availability 3,
# derive-offering-summary 2, merge-nupath 2, apply-patches 1, build-equivalences
# 1, verify-chart 1 — NINETEEN `process.exit(1)` guards were being discarded.
# On 2026-09-01 the sibling majors job proved it: scrape-majors refused to write
# ("a shared-section adjudication no longer matches"), exited 1, and the step
# was reported green; the run went on to commit stale data. The comment on the
# CHART step below claiming "a failure stops the run" was simply false.
#
# Writing `shell: bash` selects `bash --noprofile --norc -eo pipefail {0}`.
# The "Assert the shell fails a broken pipe" step in the job is what stops this
# from being a claim in a comment — see there.
defaults:
  run:
    shell: bash

jobs:
  update:
    name: Fetch & commit course data
    runs-on: ubuntu-latest

    # A hung job is worse than a failed one: it holds the nu-map-data
    # concurrency group (cancel-in-progress is false), so the majors jobs queue
    # behind it — and a queued run is a run that a THIRD arrival cancels
    # outright, before it can execute a step or report anything.
    #
    # 180, down from 300. The old value was chosen as "generous" with no
    # measurement beside it, and generous is the wrong instinct for a number
    # whose only job is to bound how long this can block the other two.
    #
    # Measured, from the Actions API: 14, 16, 17, 16, 88 minutes for runs 1–5
    # (2026-06-01 … 2026-09-01). The jump is real and expected — 2026-09-01 was
    # the first run carrying both --prof and --restrictions — so the budget is
    # set against 88, not against 17. 180 is a little over twice the worst.
    #
    # The trade is deliberate: a genuinely slow month now fails and retries next
    # cycle, where before it would have run on for five hours holding the group.
    # A month of course data is recoverable and loud; a majors run cancelled
    # while pending is neither, because a run cancelled before it starts cannot
    # execute the step that would have reported it.
    timeout-minutes: 180

    steps:
      # ── The assumption every rail below rests on, checked instead of stated ─
      # `defaults.run.shell: bash` at the top of this file is the only reason a
      # failing `node … | tee log` fails its step. Delete it and this workflow
      # still looks correct — it just stops enforcing anything, silently, which
      # is precisely the 2026-09-01 failure. One shell statement settles it:
      # under pipefail the pipeline below exits 3, without it, tee's 0.
      # Runs before checkout because it needs nothing and should cost nothing.
      - name: Assert the shell fails a broken pipe
        run: |
          if (exit 3) | tee /dev/null; then
            echo "::error::pipefail is OFF — a script that exits 1 into 'tee' would report success and every rail in this workflow is disarmed. Restore 'defaults: run: shell: bash'."
            exit 1
          fi
          echo "pipefail is on — a failing script below fails its step."

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `--ignore-scripts` — see .github/workflows/test.yml. `onnxruntime-node`'s postinstall
        # fetches a ~100 MB runtime this project never loads, and it has already failed a job
        # with ETIMEDOUT. This workflow pushes to main unattended, so a third-party CDN must not
        # sit between the catalog and the scrape. The scrapers need `node-html-parser`, pure JS.
        run: npm ci --ignore-scripts

      # ── Step 1: Scrape catalog.northeastern.edu ───────────────────────────────
      - name: Scrape catalog
        run: node scripts/scrape-catalog.js --write 2>&1 | tee /tmp/catalog-log.txt

      # ── Step 2: Fetch term availability from nubanner.neu.edu ─────────────────
      #   Writes term-history.json (offered?) + term-details.json (enrollment/schedule).
      #
      #   --restrictions is a SECOND per-section pass (one getRestrictions call per
      #   CRN, ~30 min for one term) capturing the class-standing gate — "Junior
      #   (JR), Senior(SR)" — that the catalog states only in prose. Like --prof it
      #   does ONE completed term per run and caches forever, so the two together
      #   add ~60 min to this job, inside the 300-minute budget above.
      #
      #   Backfill is therefore gradual: one term a month. That is deliberate — the
      #   fold in derive-offering-summary refuses a gate whenever the terms it can
      #   see disagree, so gate coverage is expected to move as terms accumulate.
      - name: Scrape term availability
        run: node scripts/scrape-availability.js --write --prof --restrictions 2>&1 | tee /tmp/availability-log.txt

      # ── Step 2b: Derive the slim offering summary the app loads ───────────────
      - name: Derive offering summary
        run: node scripts/derive-offering-summary.js --write 2>&1 | tee /tmp/offering-log.txt

      # ── Step 2b-ii: Re-derive when each term starts and ends ──────────────────
      #   The planner decides which semester is "now" — and so which courses
      #   count as completed — from these windows. They are measured from
      #   Banner's own section meeting dates over a ROLLING 5-year window, and
      #   that rolling part is the point: NU moved Spring to a Wednesday start
      #   in 2026, and the four constants this replaced were hand-picked
      #   "typical first day + 1 week" guesses that had drifted into 2–16 days
      #   of lag at the start of a term and up to 42 at the end.
      #
      #   Non-fatal, and safe to skip: the script refuses to write at all
      #   unless the sample looks like a calendar (≥3 usable years per term
      #   type, spread under a week, windows ordered and disjoint), so a bad
      #   Banner day leaves last month's windows in place rather than
      #   corrupting them. ~20 requests.
      - name: Re-derive term windows
        run: node scripts/derive-term-windows.js --write 2>&1 | tee /tmp/term-windows-log.txt || echo "::warning::Term-window derivation skipped — windows unchanged from last run."

      # ── Step 2c: Refresh verified RateMyHusky course/professor links ──────────
      #   Matches instructor names to real reviewed professor pages (sitemap +
      #   a search-API recovery pass for reviewed profs the sitemap omits) and
      #   records the set of courses RateMyHusky actually has — so the app links
      #   only where a real page exists. ~700 lightweight requests; a couple of
      #   minutes. Best-effort: a failure must not fail the run — the app just
      #   keeps last month's map, and any unmatched name renders as plain text.
      - name: Refresh RateMyHusky links
        run: node scripts/scrape-ratemyhusky.js --write 2>&1 | tee /tmp/ratemyhusky-log.txt || echo "RateMyHusky refresh skipped (non-fatal)."

      # ── Step 2d: Refresh NUpath from the Registrar's Tableau dashboard ────────
      #   Tableau is the authoritative NUpath source and the ONLY one that
      #   carries WF and WD — the catalog prints just 11 of the 13 codes. Before
      #   this step existed, those two refreshed only when someone manually ran
      #   the legacy update-nupath workflow, so they sat frozen indefinitely.
      #
      #   --tableau (never the catalog fallback): the fallback is additive-only
      #   by policy, but forcing the authoritative source keeps a degraded read
      #   from masquerading as a real refresh. Non-fatal — if Tableau is down we
      #   keep last month's designations rather than failing the whole run.
      - name: Refresh NUpath from Tableau
        run: node scripts/fetch-nupath.js --tableau --write 2>&1 | tee /tmp/nupath-log.txt || echo "::warning::NUpath refresh skipped — Tableau unreachable. Designations unchanged from last run."

      # ── Step 2e: Propagate NUpath into the runtime file ───────────────────────
      #   fetch-nupath writes all-courses.json; the app loads catalog-courses.json.
      #   This carries additions AND corrections across, so a code the Registrar
      #   removed actually disappears from what students and advisors see.
      - name: Merge NUpath into catalog-courses
        run: node scripts/merge-nupath.js --write 2>&1 | tee /tmp/nupath-merge-log.txt

      # ── Step 3: Apply manual patches ──────────────────────────────────────────
      - name: Apply patches
        run: node scripts/apply-patches.js --write 2>&1 | tee /tmp/patches-log.txt

      # ── Step 4: Derive the course-equivalence index ───────────────────────────
      # Must run AFTER patches: it reads the finished catalog-courses.json (for
      # prereq trees, titles, credits and descriptions) plus the committed
      # program requirement files. Pure derivation, no network. Its own write
      # rails refuse to emit if the result looks like upstream breakage, so a
      # failure here should stop the run rather than ship a gutted index.
      - name: Build course equivalences
        run: node scripts/build-equivalences.js --write 2>&1 | tee /tmp/equivalences-log.txt

      # ── CHART: every plan this data can produce must be legal ────────────────
      #
      # Runs BEFORE the commit, and a failure stops the run. That ordering is the whole
      # point: this workflow pushes straight to main unattended, so the alternative is
      # discovering the problem from a student.
      #
      # It is needed because CHART's inputs move without any code change to review. A course
      # whose offering history tips past the 50% availability bar, or a requirement section
      # that gains a course, can turn a clean plan into one carrying a hard error — and the
      # monthly scrape is exactly what tips it. The invariant suite checks a sample so it can
      # run after every edit; this checks all ~748 degrees against every published variant.
      #
      # Gated on order, availability and the credit cap — the rules a student cannot work
      # around, because the registrar refuses the enrolment. The four-course convention is
      # reported and not gated: CHART relaxes it where it is unsatisfiable, and 4.2% of
      # published full terms miss it too.
      # `--all` is REQUIRED and load-bearing. Without it the script runs a covering sample
      # and exits 3, because a sample is the right default for a question asked in a chat and
      # the wrong one for the gate that decides whether a month of scraped data ships. The
      # flag is what distinguishes the two, so do not drop it to make this step faster.
      - name: Verify CHART can still plan this catalog
        run: node scripts/verify-chart.js --all 2>&1 | tee /tmp/chart-verify-log.txt

      # ── The data must be SHIPPABLE, not merely correct ────────────────────
      #
      # `npm run build` is the command Cloudflare Pages runs, and it is the only
      # thing that exercises the data-driven parts of the site: the /data search
      # index fails the build on a generated page carrying no index record, and
      # the AI surface generates a page per course. New courses are precisely
      # what a monthly scrape produces.
      #
      # Nothing has ever run it against scraped data. A push made with the
      # default GITHUB_TOKEN triggers no workflow — measured on the three bot
      # commits on main, zero runs each — so the data commits were the one class
      # of change to main that CI never saw. test.yml's own comment describes
      # the failure this prevents ("Cloudflare rejects the upload, the site
      # keeps serving the last good build, and the monthly scrape goes on
      # committing data that never ships") and then could not prevent it,
      # because it does not run here.
      #
      # Before the commit, deliberately: data that cannot be built must not be
      # pushed. The suites go with it — they are where DATA shape is asserted.
      - name: Build the site the way Cloudflare will
        run: npm run build 2>&1 | tee /tmp/build-log.txt

      - name: Suites that assert on data shape
        run: npm test 2>&1 | tee /tmp/suites-log.txt

      # ── Commit and push directly to main ──────────────────────────────────────
      #
      # ONE step, and that is a fix rather than tidying. A `Check for changes`
      # gate used to stand in front of it deciding on `git diff --quiet`, which
      # is blind to UNTRACKED files — and the first scrape of a new catalog
      # edition writes nothing BUT untracked files. A run that produced a whole
      # new edition would have reported "already up-to-date" and thrown it away,
      # green. Staging is the only honest test of "did this run produce
      # anything", so staging happens first and decides.
      - name: Commit and push
        run: |
          git config user.name  "nu-map-bot"
          git config user.email "nu-map-bot@users.noreply.github.com"

          DATE=$(date -u '+%Y-%m')

          # Staged by AREA with -A, not from a hand-kept list of filenames.
          # That list is exactly how 2026-08-03 and 2026-09-01 failed: this job
          # started writing public/northeastern/all-courses.json again when the
          # Tableau step landed on 2026-08-02, the filename had been dropped
          # from the list back in May, and every run since died at
          # `git pull --rebase` with "cannot pull with rebase: You have
          # unstaged changes" — after a clean 88-minute scrape. -A also stages
          # deletions and files nobody has thought of yet, which a list cannot.
          git add -A -- \
            public/northeastern/ \
            src/core/dataMeta.json \
            src/adapters/northeastern/termWindows.js \
            data/northeastern/scrape-state.json \
            public/data-meta.json

          # Nothing this run touched may be left behind unnoticed.
          #
          # A TRACKED file modified and not staged is unambiguously a dropped
          # update — the file is already part of the shipped dataset — so it
          # stops the run HERE, before the commit, naming itself. That is worth
          # a red run: the alternative is shipping a half-updated dataset (a
          # fresh catalog beside a stale all-courses.json that merge-nupath
          # reads), which is wrong information rather than less of it.
          # Untracked leftovers are only reported; they may be scratch.
          UNSTAGED=$(git status --porcelain | awk 'substr($0,1,2) != "??" && substr($0,2,1) != " " { print substr($0,4) }')
          UNTRACKED=$(git status --porcelain | awk 'substr($0,1,2) == "??" { print substr($0,4) }')
          if [ -n "$UNSTAGED" ]; then
            echo "::error::This run modified tracked files that no staged path covers. They would be dropped, and 'git pull --rebase' refuses to run at all while they are dirty. Add them to the 'git add' list above, or find out why a script wrote them:"
            echo "$UNSTAGED"
            exit 1
          fi
          if [ -n "$UNTRACKED" ]; then
            echo "::warning::Untracked files were left behind and NOT committed:"
            echo "$UNTRACKED"
          fi

          if git diff --cached --quiet; then
            echo "✅  Course data is already up-to-date — nothing to commit."
            exit 0
          fi

          git commit -m "data: update courses (catalog + availability) [$DATE]

          Triggered by: scheduled run
          Workflow run: ${{ github.run_id }}"

          # Rebase before pushing: the concurrency group should prevent a race,
          # but a rejected push would discard this run's data entirely.
          # --autostash so that a stray unstaged file can never again turn a
          # good scrape into exit 128; after the check above there should be
          # nothing to stash, and this is the belt to that pair of braces.
          # Retried because the group is not a guarantee — a human can push
          # between our pull and our push, and losing a month of data to that
          # would be absurd.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt $attempt failed — retrying"
            # Read from the environment purely so the contract test can drive
            # this loop without adding 15 seconds to every CI run. Nothing sets
            # it here, so unattended runs wait the full 15 seconds.
            sleep "${PUSH_RETRY_DELAY:-15}"
          done
          echo "::error::could not push after 3 attempts; this run's data has NOT landed."
          exit 1

      # ── Tell someone ──────────────────────────────────────────────────────────
      #   This job pushes to main with nobody watching. Without these two steps a
      #   failure is a red tick on a page no one opens, and the site keeps serving
      #   last month's catalog looking perfectly healthy.
      - name: Report failure
        if: failure()
        uses: ./.github/actions/pipeline-alert
        with:
          pipeline: Course data
          key: courses
          state: failed
          # Every log this job writes, in pipeline order. It used to list six of
          # ten, and the four it left out included /tmp/chart-verify-log.txt —
          # the gate that decides whether a month of data is safe to ship. An
          # alert that omits the failing step's output is a link with extra
          # words. The action bounds each tail, so length is not a reason to
          # leave one out.
          logs: |
            /tmp/catalog-log.txt
            /tmp/availability-log.txt
            /tmp/offering-log.txt
            /tmp/term-windows-log.txt
            /tmp/ratemyhusky-log.txt
            /tmp/nupath-log.txt
            /tmp/nupath-merge-log.txt
            /tmp/patches-log.txt
            /tmp/equivalences-log.txt
            /tmp/chart-verify-log.txt
            /tmp/build-log.txt
            /tmp/suites-log.txt
          data-paths: |
            public/northeastern/catalog-courses.json
            public/northeastern/term-history.json
          check-first: |
            - **Catalog scrape** — `catalog.northeastern.edu` markup. The
              `Attribute(s):` line is a plain `<p class="courseblockextra">` with no
              nupath class; it must be found by its label text, never a class
              selector. A class-based selector once matched zero blocks and made the
              catalog contribute no NUPath at all, silently.
            - **Availability scrape** — Banner term codes. NEU retired the 40/60
              summer codes; a single `…50` code now carries both sessions and is
              split back by `partOfTerm`. A new term code shape breaks this first.
            - **NUpath** — Tableau is authoritative and non-fatal, so this step
              *cannot* be the failure. If it warned, NUpath silently kept last
              month's values; check how many runs in a row that has happened.
            - `fetch-nupath` refuses to write if a run would clear more than 5% of
              courses. A refusal here is the guard working, not a bug — find what
              changed upstream before overriding anything.

      - name: Report recovery
        if: success()
        uses: ./.github/actions/pipeline-alert
        with:
          pipeline: Course data
          key: courses
          state: recovered
          data-paths: |
            public/northeastern/catalog-courses.json

      # ── Write run summary ─────────────────────────────────────────────────────
      # Every log, not three of them — and the `|| echo "(no log)"` on the old
      # version wrote its apology to stdout rather than to the summary, so a
      # missing log left a silently empty code fence.
      #
      # Tailed, because $GITHUB_STEP_SUMMARY is capped at 1 MiB and the runner
      # DISCARDS the whole summary when it overflows: ten raw scrape logs is a
      # plausible way to lose the report entirely. The complete output of every
      # step is in the run's own log regardless.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Course Data Update Summary"
            echo ""
            for log in /tmp/catalog-log.txt /tmp/availability-log.txt /tmp/offering-log.txt \
                       /tmp/term-windows-log.txt /tmp/ratemyhusky-log.txt /tmp/nupath-log.txt \
                       /tmp/nupath-merge-log.txt /tmp/patches-log.txt /tmp/equivalences-log.txt \
                       /tmp/chart-verify-log.txt /tmp/build-log.txt /tmp/suites-log.txt; do
              name=$(basename "$log")
              if [ ! -s "$log" ]; then
                echo "- \`$name\` — no output (the step did not run, or wrote nothing)"
                continue
              fi
              echo "<details><summary><code>$name</code> (last 200 lines)</summary>"
              echo ""
              echo '```'
              tail -n 200 "$log"
              echo '```'
              echo "</details>"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"
