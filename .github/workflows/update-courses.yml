name: Update Course Data

# Runs on the 1st of every month at 06:00 UTC.
#
# Every month:
#   1. Scrape catalog.northeastern.edu → catalog-courses.json
#   2. Query nubanner.neu.edu for recent term availability → term-history.json
#   3. Apply manual patches
#
# Pushes directly to main — no PR. Same pattern as update-nupath.yml.

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of every month
  workflow_dispatch:

# All data workflows share one concurrency group. They each commit straight to
# main, so two running at once means two pushes from stale checkouts and the
# loser's data is silently dropped until the next cycle — two months, for the
# bimonthly majors jobs.
#
# The 06:00/08:00/09:00 stagger expresses the right ORDER (courses before
# majors, because the majors verifier validates every course reference against
# the course data — stale courses produce false "unknown course" findings).
# But a stagger is not a guarantee: update-courses also runs a Banner
# availability scrape with --prof, one call per section, plus ~700 RateMyHusky
# requests, and can overrun two hours. This makes the ordering enforced rather
# than hoped for.
concurrency:
  group: nu-map-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Fetch & commit course data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Step 1: Scrape catalog.northeastern.edu ───────────────────────────────
      - name: Scrape catalog
        run: node scripts/scrape-catalog.js --write 2>&1 | tee /tmp/catalog-log.txt

      # ── Step 2: Fetch term availability from nubanner.neu.edu ─────────────────
      #   Writes term-history.json (offered?) + term-details.json (enrollment/schedule).
      - name: Scrape term availability
        run: node scripts/scrape-availability.js --write --prof 2>&1 | tee /tmp/availability-log.txt

      # ── Step 2b: Derive the slim offering summary the app loads ───────────────
      - name: Derive offering summary
        run: node scripts/derive-offering-summary.js --write 2>&1 | tee /tmp/offering-log.txt

      # ── Step 2c: Refresh verified RateMyHusky course/professor links ──────────
      #   Matches instructor names to real reviewed professor pages (sitemap +
      #   a search-API recovery pass for reviewed profs the sitemap omits) and
      #   records the set of courses RateMyHusky actually has — so the app links
      #   only where a real page exists. ~700 lightweight requests; a couple of
      #   minutes. Best-effort: a failure must not fail the run — the app just
      #   keeps last month's map, and any unmatched name renders as plain text.
      - name: Refresh RateMyHusky links
        run: node scripts/scrape-ratemyhusky.js --write 2>&1 | tee /tmp/ratemyhusky-log.txt || echo "RateMyHusky refresh skipped (non-fatal)."

      # ── Step 2d: Refresh NUpath from the Registrar's Tableau dashboard ────────
      #   Tableau is the authoritative NUpath source and the ONLY one that
      #   carries WF and WD — the catalog prints just 11 of the 13 codes. Before
      #   this step existed, those two refreshed only when someone manually ran
      #   the legacy update-nupath workflow, so they sat frozen indefinitely.
      #
      #   --tableau (never the catalog fallback): the fallback is additive-only
      #   by policy, but forcing the authoritative source keeps a degraded read
      #   from masquerading as a real refresh. Non-fatal — if Tableau is down we
      #   keep last month's designations rather than failing the whole run.
      - name: Refresh NUpath from Tableau
        run: node scripts/fetch-nupath.js --tableau --write 2>&1 | tee /tmp/nupath-log.txt || echo "::warning::NUpath refresh skipped — Tableau unreachable. Designations unchanged from last run."

      # ── Step 2e: Propagate NUpath into the runtime file ───────────────────────
      #   fetch-nupath writes all-courses.json; the app loads catalog-courses.json.
      #   This carries additions AND corrections across, so a code the Registrar
      #   removed actually disappears from what students and advisors see.
      - name: Merge NUpath into catalog-courses
        run: node scripts/merge-nupath.js --write 2>&1 | tee /tmp/nupath-merge-log.txt

      # ── Step 3: Apply manual patches ──────────────────────────────────────────
      - name: Apply patches
        run: node scripts/apply-patches.js --write 2>&1 | tee /tmp/patches-log.txt

      # ── Commit and push directly to main ──────────────────────────────────────
      - name: Check for changes
        id: changes
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "nu-map-bot"
          git config user.email "nu-map-bot@users.noreply.github.com"

          DATE=$(date -u '+%Y-%m')

          git add \
            public/northeastern/catalog-courses.json \
            public/northeastern/term-history.json \
            public/northeastern/term-details.json \
            public/northeastern/offering-summary.json \
            public/northeastern/ratemyhusky.json \
            public/northeastern/change-log.json \
            src/core/dataMeta.json \
            public/data-meta.json
          git diff --cached --quiet || git commit -m "data: update courses (catalog + availability) [$DATE]

          Triggered by: scheduled run
          Workflow run: ${{ github.run_id }}"

          # Rebase first: the concurrency group should prevent a race, but a
          # rejected push would discard this run's data entirely.
          git pull --rebase origin main
          git push origin main

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅  Course data is already up-to-date — nothing to commit."

      # ── Write run summary ─────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## Course Data Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Catalog scrape" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/catalog-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no log)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Term availability scrape" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/availability-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no log)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Patches" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/patches-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no log)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
