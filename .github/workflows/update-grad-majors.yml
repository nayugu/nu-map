name: Update Graduate Major Requirements

# Runs on the 1st of January, March, May, July, September, November at 09:00 UTC.
# Staggered 1 hour after update-majors.yml (undergrad) to avoid concurrent writes
# to the repo.
#
# Scrapes catalog.northeastern.edu graduate degree requirement pages and writes
# requirements.json files to data/northeastern/programs/graduate/{year}/{college}/{slug}/.
#
# Pushes directly to main — no PR. Same pattern as update-majors.yml.

on:
  schedule:
    - cron: "0 9 1 1,3,5,7,9,11 *"   # 1st of odd months
  workflow_dispatch:

# All data workflows share one concurrency group. They each commit straight to
# main, so two running at once means two pushes from stale checkouts and the
# loser's data is silently dropped until the next cycle — two months, for the
# bimonthly majors jobs.
#
# The 06:00/08:00/09:00 stagger expresses the right ORDER (courses before
# majors, because the majors verifier validates every course reference against
# the course data — stale courses produce false "unknown course" findings).
# But a stagger is not a guarantee: update-courses also runs a Banner
# availability scrape with --prof, one call per section, plus ~700 RateMyHusky
# requests, and can overrun two hours. This makes the ordering enforced rather
# than hoped for.
concurrency:
  group: nu-map-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # the failure alert opens/closes an issue

# ── Naming the shell is what turns pipefail on, and it is load-bearing ───────
#
# Actions' DEFAULT shell on Linux is `bash -e {0}`, with NO pipefail, so in a
# step written `node scripts/scrape-grad-majors.js --write | tee log` the step's
# exit status is TEE's — and tee always succeeds. On 2026-09-01 the sibling
# undergraduate job proved the cost: its scraper hit a rail, printed "❌
# Refusing to write", exited 1, and the step was reported GREEN; the run
# continued over an un-refreshed tree.
#
# `shell: bash` selects `bash --noprofile --norc -eo pipefail {0}`. The
# "Assert the shell fails a broken pipe" step below keeps this from being a
# claim nobody re-checks.
defaults:
  run:
    shell: bash

jobs:
  update:
    name: Scrape & commit graduate major requirements
    runs-on: ubuntu-latest

    # Turns a hang into a failure that alerts. These share the
    # nu-map-data concurrency group, so a wedged job blocks the others
    # silently for up to GitHub\'s six-hour default.
    timeout-minutes: 120

    steps:
      # ── The assumption every rail below rests on, checked instead of stated ─
      # `defaults.run.shell: bash` at the top of this file is the only reason a
      # refusing scraper fails its step. Remove it and this workflow still looks
      # correct while enforcing nothing — the 2026-09-01 failure exactly. Under
      # pipefail the pipeline below exits 3; without it, tee's 0.
      - name: Assert the shell fails a broken pipe
        run: |
          if (exit 3) | tee /dev/null; then
            echo "::error::pipefail is OFF — a script that exits 1 into 'tee' would report success and every rail in this workflow is disarmed. Restore 'defaults: run: shell: bash'."
            exit 1
          fi
          echo "pipefail is on — a failing script below fails its step."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `--ignore-scripts` — see .github/workflows/test.yml. Skips `onnxruntime-node`'s
        # ~100 MB native download, which nothing here loads and which has already failed a job
        # with ETIMEDOUT. This workflow pushes to main unattended.
        run: npm ci --ignore-scripts

      # ── Scrape graduate major requirements from catalog.northeastern.edu ──
      - name: Scrape graduate major requirements
        run: node scripts/scrape-grad-majors.js --write 2>&1 | tee /tmp/grad-majors-log.txt

      # ── Guard: fail (before committing) if the scrape introduced a section that is
      #    impossible to satisfy (shared/split-credit course not emitted as single-course
      #    XOM). Update scripts/major-integrity-baseline.json to accept intentional debt. ──
      - name: Check major integrity
        run: node scripts/check-major-integrity.js

      # ── Cross-check the scrape against the catalog ────────────────────────
      #   check-major-integrity (above) asks only whether sections remain
      #   satisfiable. This asks whether the data still agrees with the pages
      #   it came from: every requirement table parsed or explicitly excluded,
      #   every sample-plan course accounted for, every course code real.
      #
      #   Must run AFTER the scrape — the scraper deliberately drops the old
      #   metadata.verification rather than carry a stale verdict forward.
      #   Two steps so the report is still committed when the ratchet fails.
      - name: Verify requirements against the catalog
        run: node scripts/verify-majors.js --report --write 2>&1 | tee /tmp/verify-log.txt

      - name: Verification ratchet
        run: node scripts/verify-majors.js

      # ── Rebuild the bundle the hosted MCP worker serves ───────────────────
      #   The worker can't read 1,017 files over the network, so it fetches
      #   this single artifact from GitHub raw — meaning it is a COPY of
      #   src/data that can drift. It sat six weeks stale once, so production
      #   MCP answered from data predating a whole parser rewrite. Rebuilding
      #   it here, in the job that changed the data, is what stops that.
      # Program OR/XOM nodes are one of the inputs to the course-equivalence
      # index, so a requirements change can add or remove published choices.
      # Rebuild it here as well as in update-courses, or the index goes stale
      # against the very data it cites.
      - name: Rebuild course equivalences
        run: node scripts/build-equivalences.js --write 2>&1 | tee /tmp/equivalences-log.txt

      - name: Rebuild programs bundle
        run: node scripts/build-programs-bundle.js

      # ── Commit and push directly to main ──────────────────────────────────
      - name: Check for changes
        id: changes
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "nu-map-bot"
          git config user.email "nu-map-bot@users.noreply.github.com"

          DATE=$(date -u '+%Y-%m')
          # The scraper's own tally, not a guess from the log's prose. The old
          # `grep -oP 'OK\s+' | wc -l` was wrong twice: it counted the catalog's
          # POLICY pages ("Thesis Policy", "Student Time Status"), which print
          # OK and are not programs, and it missed every second program on a
          # two-variant page, which prints "↳" and no OK. It was also a pipefail
          # landmine — with the shell fixed above, a log with no matches makes
          # grep exit 1 and takes the whole commit step with it. `sed` matches
          # or does not; either way it exits 0.
          ADDED=$(sed -n 's/^Results: [0-9]* scraped, \([0-9]*\) written.*/\1/p' /tmp/grad-majors-log.txt | tail -1)
          [ -n "$ADDED" ] || ADDED="an unreported number of"

          git add data/northeastern/programs/graduate/
          # The verification verdict lives in each program file, and the report
          # and baseline are the human/machine record of this run's fidelity.
          git add docs/verification-report.md scripts/major-verify-baseline.json
          git add public/northeastern/programs-bundle.json
          git add public/northeastern/course-equivalences.json
          git diff --cached --quiet || git commit -m "data: update graduate major requirements ($ADDED programs) [$DATE]

          Source: catalog.northeastern.edu
          Triggered by: scheduled run
          Workflow run: ${{ github.run_id }}"

          # Rebase first: the concurrency group should prevent a race, but a
          # rejected push would discard this run's data entirely.
          git pull --rebase origin main
          git push origin main

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅  Graduate major requirements are already up-to-date — nothing to commit."

      # ── Write run summary ─────────────────────────────────────────────────
      # ── Tell someone ──────────────────────────────────────────────────────────
      - name: Report failure
        if: failure()
        uses: ./.github/actions/pipeline-alert
        with:
          pipeline: Graduate program requirements
          key: grad-majors
          state: failed
          logs: |
            /tmp/grad-majors-log.txt
            /tmp/verify-log.txt
            /tmp/equivalences-log.txt
          data-paths: |
            data/northeastern/programs/graduate
          check-first: |
            - Same parser and rails as the undergraduate pipeline — see the
              `majors` alert for container ids, sitemap discovery and concentrations.
              A break here usually breaks both; check whether the undergraduate run
              failed too before assuming this is graduate-specific.
            - Data fixes belong in the scrape scripts, on **both** the undergraduate and
              graduate paths. A one-off migration is overwritten by the next run.

      - name: Report recovery
        if: success()
        uses: ./.github/actions/pipeline-alert
        with:
          pipeline: Graduate program requirements
          key: grad-majors
          state: recovered
          data-paths: |
            data/northeastern/programs/graduate

      - name: Summary
        if: always()
        run: |
          echo "## Graduate Major Requirements Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/grad-majors-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no log)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
