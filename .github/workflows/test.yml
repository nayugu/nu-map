name: tests

# Each layer is its own job so a red check localizes the break to a layer
# before you open the logs. The three "pure" jobs need no npm install — the
# unit and invariant import only src/ + Node builtins (committed data, no
# runtime deps), and keeping it that way is enforced here by omitting the
# install step. CONTRACT is the one exception: it parses saved catalog HTML
# fixtures, which needs node-html-parser, so that job alone runs npm ci. Do not
# add an install step to unit or invariant — the dependency-free constraint is
# what lets major-verify.js be a pure function the invariant suite can import.
# The live job (real network) runs only on a schedule.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — full suite + live scrape smoke test

permissions:
  contents: read

# ── Why the Monday run is no longer live-only ────────────────────────────────
#
# Every job here except `live` used to carry `if: github.event_name !=
# 'schedule'`, on the reasonable assumption that a push run had already covered
# them. It had not. A push made with the default GITHUB_TOKEN does not trigger
# any workflow — measured against the three bot commits on main
# (895930f6dcf, 66ba0498c8d, f3556ea3214): zero workflow runs between them —
# so the monthly scrape's own commits were the ONE class of change to main that
# nothing in this file ever ran against. Data is also the input most likely to
# break the contract suite and the build, since new courses generate new pages.
#
# The data workflows now build and run the contract suite themselves, before
# they commit. This weekly run is the backstop for everything they do not
# cover, and for anything else that reaches main unobserved.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm run test:unit

  contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      # Only job with an install: HTML fixtures need node-html-parser.
      #
      # `--ignore-scripts`, because this job does not need a single native binary and
      # downloading one is how it failed. `@huggingface/transformers` requires
      # `onnxruntime-node`, whose postinstall fetches a ~100 MB runtime from a CDN, and that
      # fetch timed out on the runner:
      #
      #   npm error command sh -c node ./script/install
      #   AggregateError [ETIMEDOUT] connect ETIMEDOUT 150.171.110.147:443
      #
      # Nothing in this suite runs a model. It parses saved HTML with `node-html-parser`,
      # which is pure JavaScript, so the install script is pure risk here — a third-party
      # CDN sitting between a push and a green check.
      #
      # Verified: `npm ci --ignore-scripts` then `npm run test:contract` passes all 83 tests.
      # Do NOT copy this flag to a job that BUILDS — `esbuild` and `sharp` also have install
      # scripts and vite needs esbuild's.
      - run: npm ci --ignore-scripts
      - run: npm run test:contract

  invariant:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm run test:invariant

  mcp:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm --prefix mcp-server ci
      - run: npm run test:mcp

  boot:
    # ── The layer that was missing, and it cost an outage ─────────────
    #
    # On 2026-08-20 a `const` read before its initializer in PlannerContext threw on
    # every render. Every visitor got the recovery screen. The build succeeded and
    # 2,018 unit / 93 contract / 254 invariant tests passed, because nothing that
    # runs in Node evaluates a React component body — and the existing browser tests
    # SKIP unless a dev server is already listening, which CI never starts, so they
    # were a no-op here.
    #
    # This job builds and renders. It asserts only that the app mounts without a page
    # error, which is the cheapest guard against the app being dead for everyone, and
    # verified to fail on the offending commit.
    #
    # It DOES install scripts, unlike contract/live above: vite needs esbuild's, and
    # playwright needs its browser. That is why it is a separate job — the
    # dependency-free constraint on the other jobs stays intact.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:boot

      # Platform walls. This job is the only one that produces a dist/, so it is
      # the only place these can be checked at all.
      #
      # They matter here because they fail a DEPLOY, not a request: Cloudflare
      # rejects the upload, the site keeps serving the last good build, and the
      # monthly scrape goes on committing data that never ships. Nobody is
      # watching that happen. This turns it into a red check on the commit that
      # crossed the line, while the fixes are still cheap.
      #
      # Warns from 75% and only fails at 90%, so it does not block on a wall that
      # is merely worth knowing about. See scripts/load-probe.js.
      - run: npm run probe:ci

  live:
    # Non-deterministic (hits catalog.northeastern.edu). Scheduled + manual only,
    # never gating a PR. Catches NEU markup changes that break the scrape parser.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # Same reasoning as `contract`: this suite fetches NEU's catalog and parses it with
      # `node-html-parser`, and runs no model. Verified passing under `--ignore-scripts`.
      # It already depends on one network being up (catalog.northeastern.edu); there is no
      # reason to make it depend on a second one it never uses.
      - run: npm ci --ignore-scripts
      - run: npm run test:live
