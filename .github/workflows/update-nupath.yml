name: Update NUpath Data [LEGACY]

# ⚠️ SUPERSEDED — do not schedule this workflow.
#
# NUPath now refreshes MONTHLY as part of update-courses.yml: the full catalog
# scrape (scrape-catalog.js) extracts nuPath per course and diffs it. This
# standalone Tableau-dashboard scraper is kept ONLY as a manual cross-check
# against the Registrar's authoritative source when catalog pages look wrong.
#
# ┌─ MANUAL trigger (the only intended use) ──────────────────────────────┐
# │  GitHub → Actions → "Update NUpath Data" → Run workflow              │
# └───────────────────────────────────────────────────────────────────────┘

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Scraping strategy (auto / tableau / catalog)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - tableau
          - catalog

  # ── Uncomment to enable automatic updates (January, May, September) ──
  # schedule:
  #   - cron: "0 5 1 1,5,9 *"   # 05:00 UTC on the 1st of Jan, May, Sep

# All data workflows share one concurrency group. They each commit straight to
# main, so two running at once means two pushes from stale checkouts and the
# loser's data is silently dropped until the next cycle — two months, for the
# bimonthly majors jobs.
#
# ⚠ The group enforces MUTUAL EXCLUSION, not ORDER — this comment used to claim
# otherwise. It matters less here than for the scheduled jobs, since this one is
# dispatched by hand, but the sharp edge is the same: GitHub keeps at most one
# PENDING run per group and cancels the previous when a third arrives. Dispatch
# this while both majors jobs are queued and one of them disappears without
# executing a step, and therefore without alerting.
concurrency:
  group: nu-map-data
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the updated course data directly to main

# Legacy and manual-only, but it still writes data and pushes to main, so it
# gets the same shell as the live pipelines: Actions' default `bash -e` has no
# pipefail, which makes `node fetch-nupath.js | tee log` report tee's success
# and discards the script's three refusal paths — including the 5% mass-clear
# guard. See update-courses.yml for the incident this comes from.
defaults:
  run:
    shell: bash

jobs:
  update-nupath:
    name: Fetch & commit NUpath data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # `--ignore-scripts` — see .github/workflows/test.yml. Skips `onnxruntime-node`'s
        # ~100 MB native download, which nothing here loads and which has already failed a job
        # with ETIMEDOUT.
        #
        # Safe for the Playwright path this workflow exists to provide: browsers are installed
        # by the EXPLICIT `npx playwright install --with-deps chromium` step below, not by the
        # npm package's postinstall, so skipping install scripts does not skip the browser.
        run: npm ci --ignore-scripts

      # ── Install Playwright + Chromium (used for Tableau browser scraping) ─
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── Run the NUpath scraper ────────────────────────────────────────────
      - name: Scrape NUpath data
        id: scrape
        run: |
          STRATEGY="${{ github.event.inputs.strategy || 'auto' }}"
          FLAGS="--write"

          if [ "$STRATEGY" = "tableau" ]; then
            FLAGS="$FLAGS --tableau"
          elif [ "$STRATEGY" = "catalog" ]; then
            FLAGS="$FLAGS --catalog"
          fi

          echo "Strategy: $STRATEGY  |  Flags: $FLAGS"
          node scripts/fetch-nupath.js $FLAGS 2>&1 | tee /tmp/nupath-log.txt

          # Count how many nuPath values changed.
          #
          # `grep … | head -1` deliberately avoided: with pipefail now on (see
          # the top of this file) a grep with several matches is killed by
          # SIGPIPE when head closes the pipe, the pipeline "fails", and the
          # `|| echo 0` fallback silently reports zero changes — which would
          # also skip the patch re-apply below. `sed … | tail -1` reads the
          # whole stream, so it cannot be signalled, and prints nothing rather
          # than failing when the line is absent.
          CHANGED=$(sed -n 's/.*~ Changed *: *\([0-9]*\).*/\1/p' /tmp/nupath-log.txt | tail -1)
          [ -n "$CHANGED" ] || CHANGED="0"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/nupath-log.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── Propagate NUpath into the runtime file ────────────────────────────
      #   Without this the workflow does not do the job it exists for.
      #   fetch-nupath writes all-courses.json; the app, the MCP server and the
      #   worker all load catalog-courses.json. This step is what carries the
      #   designations across, and it was missing — so the documented escalation
      #   path for "Tableau's REST and direct-CSV routes both broke" fetched the
      #   data and left it in a file nothing reads. Same order as
      #   update-courses.yml: fetch → merge → patches.
      #   Unconditional, like update-courses.yml, and the pairing is why: the
      #   merge rewrites catalog-courses.json from all-courses.json, which can
      #   overwrite a patch that sets nuPath, so patches must be re-applied
      #   after it. Running merge without patches, or patches without merge,
      #   is the broken half of that pair. The old `changed != '0'` gate on
      #   patches made both reachable — `~ Changed: 0` does not mean nothing
      #   changed, only that nothing was CORRECTED, so a run that only ADDED
      #   designations skipped the step that carries them to the app.
      - name: Merge NUpath into catalog-courses
        run: node scripts/merge-nupath.js --write 2>&1 | tee /tmp/nupath-merge-log.txt

      # ── Re-apply manual patches so they're not lost ───────────────────────
      - name: Re-apply patches
        run: node scripts/apply-patches.js --write 2>&1 | tee /tmp/patches-log.txt

      # ── Commit and push directly to main ──────────────────────────────────
      #
      # Same shape as the three scheduled pipelines, and for the same reason:
      # this one staged `all-courses.json` and `change-log.json` while the
      # "Re-apply patches" step above rewrites `catalog-courses.json`. That file
      # was left dirty, and git refuses to rebase at all while anything is —
      # so this workflow ended in `cannot pull with rebase`, exit 128, after
      # doing all its work. Exactly the failure the scheduled jobs hit on
      # 2026-09-01; it was never reported here only because nobody has needed
      # the escalation path since.
      - name: Commit and push
        run: |
          git config user.name  "nu-map-bot"
          git config user.email "nu-map-bot@users.noreply.github.com"

          CHANGED="${{ steps.scrape.outputs.changed }}"
          STRATEGY="${{ github.event.inputs.strategy || 'auto' }}"
          DATE=$(date -u '+%Y-%m-%d')

          # By AREA, so a file a step starts writing tomorrow is not dropped.
          git add -A -- \
            public/northeastern/ \
            src/core/dataMeta.json \
            public/data-meta.json

          UNSTAGED=$(git status --porcelain | awk 'substr($0,1,2) != "??" && substr($0,2,1) != " " { print substr($0,4) }')
          UNTRACKED=$(git status --porcelain | awk 'substr($0,1,2) == "??" { print substr($0,4) }')
          if [ -n "$UNSTAGED" ]; then
            echo "::error::This run modified tracked files that no staged path covers. They would be dropped, and 'git pull --rebase' refuses to run at all while they are dirty:"
            echo "$UNSTAGED"
            exit 1
          fi
          if [ -n "$UNTRACKED" ]; then
            echo "::warning::Untracked files were left behind and NOT committed:"
            echo "$UNTRACKED"
          fi

          if git diff --cached --quiet; then
            echo "✅  NUpath data is already up-to-date — nothing to commit."
            exit 0
          fi

          git commit -m "data: update NUpath designations ($CHANGED changed) [$DATE]

          Source: $STRATEGY strategy (Tableau → catalog fallback)
          Triggered by: ${{ github.actor }}
          Workflow run: ${{ github.run_id }}"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt $attempt failed — retrying"
            sleep "${PUSH_RETRY_DELAY:-15}"
          done
          echo "::error::could not push after 3 attempts; this run's data has NOT landed."
          exit 1

      # ── Post a summary to the Actions run log ─────────────────────────────
      # Every log this job writes, not just the fetch's — the merge and the patch
      # re-apply can both fail the run now, and neither was visible here. Tailed,
      # because $GITHUB_STEP_SUMMARY is capped at 1 MiB and the runner discards
      # the whole summary on overflow.
      - name: Summary
        if: always()
        run: |
          {
            echo "## NUpath Update Summary"
            echo ""
            for log in /tmp/nupath-log.txt /tmp/nupath-merge-log.txt /tmp/patches-log.txt; do
              name=$(basename "$log")
              if [ ! -s "$log" ]; then
                echo "- \`$name\` — no output (the step did not run, or wrote nothing)"
                continue
              fi
              echo "<details><summary><code>$name</code> (last 200 lines)</summary>"
              echo ""
              echo '```'
              tail -n 200 "$log"
              echo '```'
              echo "</details>"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"
