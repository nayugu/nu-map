name: Update NUpath Data [LEGACY]

# ⚠️ SUPERSEDED — do not schedule this workflow.
#
# NUPath now refreshes MONTHLY as part of update-courses.yml: the full catalog
# scrape (scrape-catalog.js) extracts nuPath per course and diffs it. This
# standalone Tableau-dashboard scraper is kept ONLY as a manual cross-check
# against the Registrar's authoritative source when catalog pages look wrong.
#
# ┌─ MANUAL trigger (the only intended use) ──────────────────────────────┐
# │  GitHub → Actions → "Update NUpath Data" → Run workflow              │
# └───────────────────────────────────────────────────────────────────────┘

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Scraping strategy (auto / tableau / catalog)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - tableau
          - catalog

  # ── Uncomment to enable automatic updates (January, May, September) ──
  # schedule:
  #   - cron: "0 5 1 1,5,9 *"   # 05:00 UTC on the 1st of Jan, May, Sep

# All data workflows share one concurrency group. They each commit straight to
# main, so two running at once means two pushes from stale checkouts and the
# loser's data is silently dropped until the next cycle — two months, for the
# bimonthly majors jobs.
#
# The 06:00/08:00/09:00 stagger expresses the right ORDER (courses before
# majors, because the majors verifier validates every course reference against
# the course data — stale courses produce false "unknown course" findings).
# But a stagger is not a guarantee: update-courses also runs a Banner
# availability scrape with --prof, one call per section, plus ~700 RateMyHusky
# requests, and can overrun two hours. This makes the ordering enforced rather
# than hoped for.
concurrency:
  group: nu-map-data
  cancel-in-progress: false

permissions:
  contents: write   # needed to push the updated course data directly to main

jobs:
  update-nupath:
    name: Fetch & commit NUpath data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Install Playwright + Chromium (used for Tableau browser scraping) ─
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── Run the NUpath scraper ────────────────────────────────────────────
      - name: Scrape NUpath data
        id: scrape
        run: |
          STRATEGY="${{ github.event.inputs.strategy || 'auto' }}"
          FLAGS="--write"

          if [ "$STRATEGY" = "tableau" ]; then
            FLAGS="$FLAGS --tableau"
          elif [ "$STRATEGY" = "catalog" ]; then
            FLAGS="$FLAGS --catalog"
          fi

          echo "Strategy: $STRATEGY  |  Flags: $FLAGS"
          node scripts/fetch-nupath.js $FLAGS 2>&1 | tee /tmp/nupath-log.txt

          # Count how many nuPath values changed
          CHANGED=$(grep -oP 'Changed\s*:\s*\K\d+' /tmp/nupath-log.txt | head -1 || echo "0")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/nupath-log.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── Re-apply manual patches so they're not lost ───────────────────────
      - name: Re-apply patches
        if: steps.scrape.outputs.changed != '0'
        run: node scripts/apply-patches.js --write

      # ── Check for actual file changes ─────────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── Commit and push directly to main ──────────────────────────────────
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "nu-map-bot"
          git config user.email "nu-map-bot@users.noreply.github.com"

          CHANGED="${{ steps.scrape.outputs.changed }}"
          STRATEGY="${{ github.event.inputs.strategy || 'auto' }}"
          DATE=$(date -u '+%Y-%m-%d')

          git add public/northeastern/all-courses.json public/northeastern/change-log.json
          git commit -m "data: update NUpath designations ($CHANGED changed) [$DATE]

          Source: $STRATEGY strategy (Tableau → catalog fallback)
          Triggered by: ${{ github.actor }}
          Workflow run: ${{ github.run_id }}"

          # Rebase first: the concurrency group should prevent a race, but a
          # rejected push would discard this run's data entirely.
          git pull --rebase origin main
          git push origin main

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "✅  NUpath data is already up-to-date — nothing to commit."

      # ── Post a summary to the Actions run log ─────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## NUpath Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/nupath-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no log)"  >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
