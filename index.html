<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>NU Map | Student-Built Northeastern Course Planner</title>
    <!-- Canonical: the app also answers on nu-map.pages.dev and the github.io
         landing page; point all ranking signal at the production domain. -->
    <link rel="canonical" href="https://numap.app/" />
    <!-- "Student-built / not affiliated" is stated up front in every crawlable
         field (title + all three descriptions + JSON-LD below) so search
         engines and AI summarizers — many of which don't run JS and never
         see the in-app disclaimer modal — can't infer this is an official
         Northeastern tool. -->
    <meta name="description" content="NU Map is a student-built course planner for Northeastern University students (not affiliated with or endorsed by Northeastern University). Plan courses semester by semester, visualize prerequisites, and track degree requirements." />
    <meta name="keywords" content="Northeastern University, NU Map, course planner, course map, prerequisite map, degree planner, NEU, student-built" />
    <meta property="og:title" content="NU Map | Student-Built Northeastern Course Planner" />
    <meta property="og:description" content="A student-built course planner for Northeastern University students (not affiliated with Northeastern University). Plan courses semester by semester, visualize prerequisites, and track degree requirements." />
    <meta property="og:url" content="https://numap.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NU Map | Student-Built Northeastern Course Planner" />
    <meta name="twitter:description" content="A student-built course planner for Northeastern University students (not affiliated with Northeastern University). Plan courses semester by semester, visualize prerequisites, and track degree requirements." />
    <!-- Structured data: search engines read this directly; the disclaimer
         field states non-affiliation in a machine-readable form. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "NU Map",
      "url": "https://numap.app",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "description": "A student-built course planner for Northeastern University students. Plan courses semester by semester, visualize prerequisites, and track graduation requirements.",
      "disclaimer": "NU Map is an independent, student-built tool. It is not affiliated with, endorsed by, or officially connected to Northeastern University.",
      "isAccessibleForFree": true
    }
    </script>
    <!-- Inter is loaded non-blocking so a blocked/slow network (e.g. GFW) never
         delays first render.  The page appears immediately with the system font
         stack; once Inter is fetched the browser swaps in seamlessly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          onload="this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Size-adjusted CJK faces (public/fonts-cjk.css) are injected by
         LanguageContext only when the locale is zh/ja/ko, so the large
         stylesheet never loads for the Latin-script majority. See the
         file's header comment for the two families (Inter / InterTight). -->
    <style>
      /* CJK reads dense at the UI's small sizes — add gentle tracking,
         and scale explicit line-heights (components use
         calc(N * var(--lh-scale, 1))) to keep leading proportional to
         the size-adjusted glyphs from fonts-cjk.css.
         LanguageContext keeps the document lang in sync with the locale;
         components with explicit letterSpacing are unaffected. */
      :root:lang(zh) { letter-spacing: 0.045em; --lh-scale: 1.16; }
      :root:lang(ja) { letter-spacing: 0.02em;  --lh-scale: 1.16; }
      /* Korean: Hangul is enlarged more (size-adjust 122% in fonts-cjk.css);
         match the leading. No tracking — Korean already word-spaces. */
      :root:lang(ko) { --lh-scale: 1.22; }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      /* body + scrollbar colors are injected by ThemeContext at runtime */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      /* Form controls prefer InterTight, which (like Inter) defines ONLY
         CJK faces — at a gentler size-adjust — so tightly-wrapping
         interactive chrome grows less than body text in zh/ja/ko. Latin
         has no InterTight face and falls through to inherit/Inter, so
         this is a no-op in Latin locales. */
      button, input, select, textarea {
        font-family: 'InterTight', 'Inter', system-ui, sans-serif;
      }
      /* Header dropdown panels: cap to the viewport and scroll. vh first,
         dvh (excludes mobile browser chrome) where supported. */
      .hdr-pop {
        max-height: calc(100vh - 110px);
        max-height: calc(100dvh - 110px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* Header button hover — darker outline */
      .hdr-btn:hover   { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; background: var(--bg-surface, #f5f5f5) !important; }
      .hdr-btn-dd:hover { border-color: var(--text-4, rgba(0,0,0,0.45)) !important; }
      /* Settings rows: borderless until hover, then a light-gray outline.
         The inline default border colour is var(--bg-surface), so the row
         blends into the panel; hover swaps it for the subtle control border. */
      .set-row { transition: border-color 110ms ease; }
      .set-row:hover { border-color: var(--border-2, #d9d9d9) !important; }
      input::placeholder { font-size: inherit; opacity: 0.45; }
      .work-input::placeholder { opacity: 1; color: inherit; }
      /* Prevent browser text-selection on draggable cards (fixes serif font flash on touch) */
      [data-drag-id] { -webkit-user-select: none; user-select: none; }
    </style>
    <script>
      // Paint the correct background before React mounts so dark-mode users
      // don't see a white flash. Mirrors ThemeContext's resolution: saved
      // choice first ("ncp"/"map" storage prefixes), then the OS preference.
      (function () {
        var theme;
        try { theme = localStorage.getItem('ncp-theme') || localStorage.getItem('map-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.style.background = theme === 'dark' ? '#0d1117' : '#fefefe';
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script>
      // Boot-failure recovery. The app is a single hashed module bundle; if a
      // stale index.html slips past the cache headers and points at a chunk a
      // newer deploy deleted, the SPA fallback serves the HTML shell in its
      // place, the browser refuses to run HTML as a module, and the page sits
      // frozen. main.jsx calls window.__numapBooted() once the bundle executes;
      // if that never happens, reload ONCE to pull the current shell. Guarded by
      // a per-session timestamp so a persistent failure can never reload-loop.
      (function () {
        var booted = false;
        window.__numapBooted = function () {
          booted = true;
          try { sessionStorage.removeItem('numap-boot-retry'); } catch (e) {}
          // If this load arrived under the reveal veil, the app is up —
          // let the storm clear.
          if (window.__numapVeilDone) window.__numapVeilDone();
        };
        // Throttled reload. At most one per minute per KEY, so a persistent
        // failure can never loop.
        //
        // The two paths use different keys on purpose. A successful boot
        // clears the boot key (the problem is demonstrably gone), but that
        // would also disarm the chunk guard — reload, boot fine, fail again,
        // reload… So chunk recovery keeps its own key, which nothing clears.
        function canReload(key) {
          var last = 0;
          try { last = parseInt(sessionStorage.getItem(key) || '0', 10); } catch (e) {}
          return Date.now() - last >= 60000;
        }
        function reloadOnce(key) {
          if (!canReload(key)) return false;
          try { sessionStorage.setItem(key, String(Date.now())); } catch (e) {}
          // Every recovery reload announces itself to the NEXT page, which
          // boots under the storm veil and clears it once alive.
          try { sessionStorage.setItem('numap-reveal', '1'); } catch (e) {}
          window.location.reload();
          return true;
        }
        function resolveDark() {
          var theme;
          try { theme = localStorage.getItem('ncp-theme') || localStorage.getItem('map-theme'); } catch (e) {}
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          return theme === 'dark';
        }

        // ── Petal storm (shared by the exit and the reveal veil) ─────
        // Dense, fast, wind-blown diagonal fall; phase-uniform delays
        // (stride 5, coprime to 36) keep it a wall of motion, not waves.
        // Each petal ACCELERATES left→right (ease-in cubic-bezier = a wind
        // force, not constant speed), and the infinite repeat means fresh
        // petals keep arriving from the left. The layer itself carries a
        // gust cycle — irregular opacity waves, so the storm obstructs
        // more at some moments than others, like real weather.
        function stormStyle() {
          if (document.getElementById('numap-storm-style')) return;
          var s = document.createElement('style');
          s.id = 'numap-storm-style';
          s.textContent =
            '@keyframes numapStorm{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(150vw,42vh,0) rotate(480deg)}}'
            + '@keyframes numapGust{0%{opacity:.35}22%{opacity:.85}41%{opacity:.55}63%{opacity:1}82%{opacity:.6}100%{opacity:.35}}'
            + '@keyframes numapBlowoff{from{transform:translateX(0)}to{transform:translateX(135vw)}}'
            + '@keyframes numapCardDim{0%{opacity:1}22%{opacity:.5}38%{opacity:.75}58%{opacity:.3}72%{opacity:.45}100%{opacity:0}}'
            + '@keyframes numapTileOut{to{opacity:0}}';
          document.head.appendChild(s);
        }
        function addStorm(parent, n) {
          stormStyle();
          for (var i = 0; i < n; i++) {
            var sz = 8 + ((i * 37) % 9);
            var dur = 1.2 + ((i * 53) % 100) / 100;
            var dl = -(dur * ((i * 5) % n) / n);
            var tp = ((i * 61 + 3) % 100) - 8;
            var col = i % 3 === 0 ? '#ef4444' : i % 3 === 1 ? '#f87171' : '#fca5a5';
            var op = 0.4 + ((i * 17) % 40) / 100;
            var d = document.createElement('div');
            d.style.cssText = 'position:absolute;top:' + tp + '%;left:-12%;animation:numapStorm ' + dur + 's cubic-bezier(.5,.05,.85,.45) ' + dl + 's infinite;';
            d.innerHTML = '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 12 12" style="display:block;opacity:' + op + '" aria-hidden="true"><path d="M6 0 C 9.2 2.4, 9.2 7.2, 6 12 C 2.8 7.2, 2.8 2.4, 6 0" fill="' + col + '"/></svg>';
            parent.appendChild(d);
          }
        }

        // ── The reveal veil ──────────────────────────────────────────
        // A recovery reload sets numap-reveal; the NEXT page builds this
        // theme-colored storm veil before the app can paint, lets the app
        // boot beneath it, and clears the storm once __numapBooted fires
        // (or after 5 s regardless — the veil must never trap anyone).
        function buildVeil() {
          if (document.getElementById('numap-veil')) return;
          stormStyle();
          var dark = resolveDark();
          var bg = dark ? '#0d1117' : '#fefefe';
          var bgT = dark ? 'rgba(13,17,23,0)' : 'rgba(254,254,254,0)';
          var v = document.createElement('div');
          v.id = 'numap-veil';
          v.style.cssText = 'position:fixed;inset:0;z-index:999999;overflow:hidden;pointer-events:none;';
          // A solid base plus twenty overlapping soft-edged patches
          // (radial gradients). Dissolving clears the base first — the
          // whole app shows through faintly — then each patch fades on
          // its own clock, so the page surfaces part by part.
          var base = document.createElement('div');
          base.style.cssText = 'position:absolute;inset:0;background:' + bg + ';';
          v.appendChild(base);
          var tiles = [];
          for (var r = 0; r < 4; r++) {
            for (var c = 0; c < 5; c++) {
              var t = document.createElement('div');
              t.style.cssText = 'position:absolute;left:' + (c * 25 - 9) + '%;top:' + (r * 25 - 9) + '%;width:43%;height:43%;'
                + 'background:radial-gradient(ellipse at center,' + bg + ' 52%,' + bgT + ' 78%);';
              v.appendChild(t);
              tiles.push(t);
            }
          }
          var storm = document.createElement('div');
          storm.style.cssText = 'position:absolute;inset:0;animation:numapGust 2.6s ease-in-out infinite;';
          addStorm(storm, 36);
          v.appendChild(storm);
          document.body.appendChild(v);
          var done = false;
          window.__numapVeilDone = function () {
            if (done) return;
            done = true;
            setTimeout(function () {
              base.style.animation = 'numapTileOut .7s ease forwards';
              for (var i = 0; i < tiles.length; i++) {
                // Stride 7 is coprime to 20 → the patch order is scattered,
                // never a sweep.
                var dl = ((i * 7) % 20) * 0.06;
                var du = 0.5 + ((i * 11) % 5) * 0.09;
                tiles[i].style.animation = 'numapTileOut ' + du + 's ease ' + dl + 's forwards';
              }
              storm.style.transition = 'opacity 1.2s ease .6s';
              storm.style.opacity = '0';
              setTimeout(function () { if (v.parentNode) v.parentNode.removeChild(v); }, 2300);
            }, 250);
          };
          if (booted) window.__numapVeilDone();
          else setTimeout(window.__numapVeilDone, 5000);
        }
        var wantReveal = false;
        try {
          wantReveal = sessionStorage.getItem('numap-reveal') === '1';
          sessionStorage.removeItem('numap-reveal');
        } catch (e) {}
        // Design preview: ?preview=reveal plays the ending on a normal load.
        if (!wantReveal && /[?&]preview=reveal\b/.test(location.search)) wantReveal = true;
        if (wantReveal) {
          var vIv = setInterval(function () {
            if (!document.body) return;
            clearInterval(vIv);
            buildVeil();
          }, 5);
        }

        // ── Recovery auto-detection ──────────────────────────────────
        // While the overlay is up, probe every 4 s: fetch the current
        // shell, find its entry-bundle URL, and HEAD it. When both
        // succeed the deployment is consistent again — play the storm
        // exit and reload into the reveal instead of waiting for the
        // user or the blunt once-a-minute retry.
        var probeTimer = null;
        function stopProbe() { if (probeTimer) { clearInterval(probeTimer); probeTimer = null; } }
        // Detection outcome, all in one smooth breath: the loading bar
        // folds away (its job is done), the streamer closes its gap into
        // a complete ring around the logo (the dash grows to swallow the
        // gap — same period, so the morph is seamless), the message
        // fades, and a quiet outlined localized button arrives in the
        // text's footprint. The emblem itself never moves.
        function offerReturn() {
          if (exiting || document.getElementById('numap-back-link')) return;
          var lc = 'en';
          try { lc = (localStorage.getItem('ncp-locale') || navigator.language || 'en').slice(0, 2); } catch (e) {}
          var dark = resolveDark();
          var bar = document.getElementById('numap-recovery-bar');
          if (bar) {
            bar.style.transition = 'opacity .7s ease, height .7s ease, margin-bottom .7s ease';
            bar.style.opacity = '0';
            bar.style.height = '0';
            bar.style.marginBottom = '0';
          }
          var rib = document.getElementById('numap-ribbon');
          if (rib) {
            rib.style.strokeDasharray = '150 90';
            void rib.getBoundingClientRect(); // pin the start value, then transition
            rib.style.transition = 'stroke-dasharray 1.1s ease';
            rib.style.strokeDasharray = '240 0';
          }
          // The closed ring IS the way back: the whole emblem becomes a
          // button (alongside the text one), with a gentle hover swell.
          var emb = document.getElementById('numap-emblem');
          if (emb) {
            emb.style.cursor = 'pointer';
            emb.style.transition = 'transform .35s ease';
            emb.setAttribute('role', 'button');
            emb.title = RECOVERY_BACK[lc] || RECOVERY_BACK.en;
            emb.onclick = function () { window.__numapRecoveryExit(); };
            emb.onmouseenter = function () { emb.style.transform = 'scale(1.05)'; };
            emb.onmouseleave = function () { emb.style.transform = ''; };
          }
          var m = document.getElementById('numap-recovery-msg');
          var s2 = document.getElementById('numap-recovery-sub');
          if (m) { m.style.transition = 'opacity .6s'; m.style.opacity = '0'; }
          if (s2) { s2.style.transition = 'opacity .6s'; s2.style.opacity = '0'; }
          setTimeout(function () {
            var box = document.getElementById('numap-recovery-text');
            if (!box || document.getElementById('numap-back-link')) return;
            if (m) m.style.visibility = 'hidden';
            if (s2) s2.style.visibility = 'hidden';
            var a = document.createElement('button');
            a.id = 'numap-back-link';
            a.textContent = RECOVERY_BACK[lc] || RECOVERY_BACK.en;
            a.style.cssText = 'position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content;'
              + 'font-size:16px;font-weight:500;font-family:inherit;cursor:pointer;padding:9px 26px;border-radius:10px;'
              + 'background:transparent;color:inherit;border:1px solid ' + (dark ? '#30363d' : '#e2e8f0') + ';'
              + 'opacity:0;transition:opacity 1.6s ease;';
            a.onclick = function () { window.__numapRecoveryExit(); };
            box.appendChild(a);
            // A breath after the old text is gone, then a slow arrival.
            setTimeout(function () { a.style.opacity = '1'; }, 250);
          }, 620);
        }
        // onUp defaults to the storm exit; previews pass their own handler.
        // The second regex alternative matches the Vite dev shell so the
        // detection is testable on localhost.
        function startProbe(onUp) {
          if (probeTimer || !window.fetch) return;
          probeTimer = setInterval(function () {
            fetch('/', { cache: 'no-store' })
              .then(function (r) { return r.text(); })
              .then(function (html) {
                var m = html.match(/\/assets\/index-[^"']+\.js|\/src\/main\.jsx/);
                if (!m) return;
                return fetch(m[0], { method: 'HEAD', cache: 'no-store' }).then(function (r2) {
                  if (r2 && r2.ok) { stopProbe(); (onUp || offerReturn)(); }
                });
              })
              .catch(function () {});
          }, 4000);
        }

        // ── Storm exit: intensify, then reload into the reveal ───────
        // Exit choreography (~2.3 s): the storm rises and gusts, the
        // ambient petal field feels the same wind — it ACCELERATES off
        // the right edge (ease-in curve, force not velocity) — and the
        // card flickers dimmer and brighter in the gusts until it's
        // gone. The navigation happens deep inside the storm.
        function exitChoreo() {
          overlayStorm();
          var card = document.getElementById('numap-recovery-card');
          if (card) card.style.animation = 'numapCardDim 2.2s ease-in-out forwards';
          var amb = document.querySelector('#numap-recovery .nmr-petals');
          if (amb) amb.style.animation = 'numapBlowoff 2.4s cubic-bezier(.5,0,.85,.5) forwards';
        }
        function undoChoreo() {
          var layer = document.getElementById('numap-overlay-storm');
          if (layer && layer.parentNode) layer.parentNode.removeChild(layer);
          var card = document.getElementById('numap-recovery-card');
          if (card) card.style.animation = '';
          var amb = document.querySelector('#numap-recovery .nmr-petals');
          if (amb) amb.style.animation = '';
        }
        var exiting = false;
        window.__numapRecoveryExit = function () {
          if (exiting) return;
          exiting = true;
          stopProbe();
          exitChoreo();
          setTimeout(function () {
            try { sessionStorage.setItem('numap-reveal', '1'); } catch (e) {}
            // Leaving a preview drops the preview param, so the storm
            // genuinely returns to the real app instead of the preview.
            if (/[?&]preview=/.test(location.search)) location.href = location.pathname;
            else window.location.reload();
          }, 2300);
        };
        function overlayStorm() {
          showRecovery();
          var host = document.getElementById('numap-recovery');
          if (!host || document.getElementById('numap-overlay-storm')) return;
          var layer = document.createElement('div');
          layer.id = 'numap-overlay-storm';
          layer.style.cssText = 'position:absolute;inset:0;overflow:hidden;pointer-events:none;animation:numapGust 2.6s ease-in-out infinite;';
          addStorm(layer, 36);
          host.appendChild(layer);
        }
        // Throttled reload with the same choreography; if the throttle
        // holds when the moment comes, the storm dies back down.
        function stormReload(key) {
          if (exiting || !canReload(key)) return;
          exitChoreo();
          setTimeout(function () {
            if (!exiting && !reloadOnce(key)) undoChoreo();
          }, 2300);
        }

        // Recovery overlay — the reloads above used to be silent, so during
        // a deploy (or inside the once-a-minute throttle) the page just sat
        // white. This tells the user what is happening and gives them a
        // manual Reload for the throttled case. Standalone on purpose: no
        // app CSS/JS, so it works precisely when the bundle doesn't.
        // Strings mirror src/ui/RecoveryBoundary.jsx — they can't live in
        // src/locales because none of that has loaded when this runs.
        var RECOVERY_MSG = {
          en: 'NU Map just updated. Loading the new version…',
          es: 'NU Map se acaba de actualizar. Cargando la nueva versión…',
          fr: "NU Map vient d'être mis à jour. Chargement de la nouvelle version…",
          ar: 'تم تحديث NU Map للتو. جارٍ تحميل النسخة الجديدة…',
          hi: 'NU Map अभी अपडेट हुआ है। नया संस्करण लोड हो रहा है…',
          ja: 'NU Map が更新されました。新しいバージョンを読み込んでいます…',
          ko: 'NU Map이 방금 업데이트되었습니다. 새 버전을 불러오는 중…',
          zh: 'NU Map 刚刚更新，正在加载新版本…'
        };
        var RECOVERY_SUB = {
          en: 'This usually resolves within a minute or two.',
          es: 'Esto suele resolverse en uno o dos minutos.',
          fr: 'Cela se résout généralement en une à deux minutes.',
          ar: 'عادةً ما يُحل هذا خلال دقيقة أو دقيقتين.',
          hi: 'यह आमतौर पर एक-दो मिनट में ठीक हो जाता है।',
          ja: '通常は 1〜2 分ほどで復旧します。',
          ko: '보통 1~2분 안에 해결됩니다.',
          zh: '通常一两分钟内即可恢复。'
        };
        var RECOVERY_BACK = {
          en: 'Back to NU Map',
          es: 'Volver a NU Map',
          fr: 'Retour à NU Map',
          ar: 'العودة إلى NU Map',
          hi: 'NU Map पर वापस जाएँ',
          ja: 'NU Map に戻る',
          ko: 'NU Map으로 돌아가기',
          zh: '返回 NU Map'
        };
        function showRecovery() {
          var make = function () {
            if (document.getElementById('numap-recovery') || !document.body) return;
            var lc = 'en';
            try { lc = (localStorage.getItem('ncp-locale') || navigator.language || 'en').slice(0, 2); } catch (e) {}
            var msg = RECOVERY_MSG[lc] || RECOVERY_MSG.en;
            var sub = RECOVERY_SUB[lc] || RECOVERY_SUB.en;
            // Same theme resolution as the pre-paint script above, so this
            // overlay blends with whatever background is already up. If a
            // reveal veil is mid-flight, the overlay replaces it — the app
            // evidently didn't make it.
            var dark = resolveDark();
            var veil = document.getElementById('numap-veil');
            if (veil && veil.parentNode) veil.parentNode.removeChild(veil);
            var el = document.createElement('div');
            el.id = 'numap-recovery';
            el.dir = lc === 'ar' ? 'rtl' : 'ltr';
            el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;'
              + (dark ? 'background:#0d1117;color:#e2e8f0;' : 'background:#fefefe;color:#1e293b;');
            // The sweeping bar is the app's own loading-screen bar (same
            // size, radius and active→link gradient), just indeterminate —
            // it says "alive and working", not "static page". Above it, the
            // emblem: the logo floating between two counter-rotating ribbon
            // arcs and four bobbing paper-ribbon strips (SMIL, so no CSS
            // transform-box juggling). Confetti bobs use nested <g>: outer
            // animates translate, inner holds the static placement.
            // One color: the logo's red carries the whole screen — the
            // single ribbon and the sweeping bar segment both wear it.
            var rib1 = '#ef4444';
            // Petal drift over the whole screen: a dozen petals in tints of
            // the logo red, each falling on its own clock (negative delays
            // start them mid-flight) while an inner sway tumbles them.
            // Deterministic pseudo-randomness from the index — no RNG, so
            // every load looks the same and nothing needs storing. Behind
            // the card (earlier in the DOM), pointer-events off.
            var petals = '';
            for (var i = 0; i < 14; i++) {
              var pl = (i * 83 + 7) % 100;
              var ps = 10 + ((i * 37) % 8);
              var pf = 9 + ((i * 53) % 70) / 10;
              // Phase-uniform: each petal starts at an evenly spaced
              // fraction of its own fall (5 is coprime to 14, so the
              // fractions cover the whole cycle) — the shower is steady
              // at every height, never bunches, never leaves gaps.
              var pd = -(pf * ((i * 5) % 14) / 14);
              var pw = 2.4 + ((i * 29) % 20) / 10;
              var pc = i % 3 === 0 ? '#ef4444' : i % 3 === 1 ? '#f87171' : '#fca5a5';
              var po = 0.35 + ((i * 17) % 30) / 100;
              petals += '<div style="position:absolute;top:-6vh;left:' + pl + '%;animation:numapFall ' + pf + 's linear ' + pd + 's infinite;">'
                + '<svg width="' + ps + '" height="' + ps + '" viewBox="0 0 12 12" style="display:block;opacity:' + po + ';animation:numapSway ' + pw + 's ease-in-out ' + (pd / 2) + 's infinite alternate;" aria-hidden="true">'
                + '<path d="M6 0 C 9.2 2.4, 9.2 7.2, 6 12 C 2.8 7.2, 2.8 2.4, 6 0" fill="' + pc + '"/></svg></div>';
            }
            el.innerHTML =
              '<style>'
              + '@keyframes numapRecoverySweep{from{transform:translateX(' + (lc === 'ar' ? '250%' : '-100%') + ')}to{transform:translateX(' + (lc === 'ar' ? '-100%' : '250%') + ')}}'
              + '@keyframes numapRecoveryIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}'
              + '@keyframes numapFloat{from{transform:translateY(-2px)}to{transform:translateY(3px)}}'
              + '@keyframes numapGlint{0%{left:-45%}55%{left:125%}100%{left:125%}}'
              + '@keyframes numapFall{from{transform:translateY(0)}to{transform:translateY(112vh)}}'
              + '@keyframes numapSway{from{transform:translateX(-10px) rotate(-40deg)}to{transform:translateX(10px) rotate(40deg)}}'
              + '@media (prefers-reduced-motion:reduce){#numap-recovery *{animation:none !important}#numap-recovery .nmr-petals{display:none}}'
              + '</style>'
              + '<div class="nmr-petals" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;">' + petals + '</div>'
              // Top-anchored positioner: the emblem sits at the same
              // viewport spot on BOTH recovery pages and in every state —
              // content changes below it can never move it.
              + '<div style="position:absolute;top:calc(50% - 118px);left:50%;transform:translateX(-50%);width:100%;max-width:468px;padding:0 24px;box-sizing:border-box;">'
              + '<div id="numap-recovery-card" style="animation:numapRecoveryIn .35s ease-out;position:relative;">'
              + '<div id="numap-emblem" style="position:relative;width:120px;height:120px;margin:0 auto 14px;">'
              + '<svg viewBox="0 0 120 120" style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;" aria-hidden="true">'
              // One ribbon streamer: a long dash segment flowing along a
              // slightly eccentric loop (dashoffset shifts one dash+gap
              // period, so the flow loops seamlessly) while the loop
              // itself slowly turns.
              + '<g opacity="0.9"><animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="16s" repeatCount="indefinite"/>'
              + '<path id="numap-ribbon" d="M60 8 C 90 6, 114 30, 110 60 C 106 90, 84 112, 56 110 C 26 108, 6 84, 10 56 C 14 30, 32 10, 60 8" stroke="' + rib1 + '" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="150 90">'
              + '<animate attributeName="stroke-dashoffset" from="0" to="-240" dur="3.2s" repeatCount="indefinite"/></path></g>'
              + '</svg>'
              // The logo itself: floating, with a diagonal glint sweeping
              // INSIDE the letterform — the PNG doubles as a CSS mask, so
              // the sheen travels only through the N and matches its slant.
              + '<div style="position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;animation:numapFloat 3s ease-in-out infinite alternate;">'
              + '<img src="/logo.png" alt="" onerror="this.parentNode.style.display=\'none\'" style="width:100%;height:100%;display:block;"/>'
              + '<div style="position:absolute;inset:0;overflow:hidden;-webkit-mask-image:url(/logo.png);-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;mask-image:url(/logo.png);mask-size:contain;mask-repeat:no-repeat;">'
              + '<div style="position:absolute;top:-20%;bottom:-20%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8),transparent);animation:numapGlint 2.6s ease-in-out infinite;"></div>'
              + '</div></div>'
              + '</div>'
              + '<div id="numap-recovery-bar" style="width:260px;height:4px;border-radius:99px;overflow:hidden;margin:0 auto 20px;background:' + (dark ? '#21262d' : '#e2e8f0') + ';">'
              + '<div style="width:40%;height:100%;border-radius:99px;background:' + rib1
              + ';animation:numapRecoverySweep 1.3s ease-in-out infinite alternate;"></div></div>'
              + '<div id="numap-recovery-text" style="position:relative;">'
              + '<div id="numap-recovery-msg" style="font-size:15px;font-weight:600;max-width:420px;line-height:1.5;">' + msg + '</div>'
              + '<div id="numap-recovery-sub" style="margin-top:6px;font-size:12px;font-weight:500;color:' + (dark ? '#8b949e' : '#64748b') + ';">' + sub + '</div>'
              + '</div>'
              + '</div>'
              + '</div>';
            document.body.appendChild(el);
          };
          if (document.body) make();
          else document.addEventListener('DOMContentLoaded', make);
        }

        // Design preview: ?preview=recovery shows the overlay without any
        // failure (nothing reloads), so it can be styled against reality.
        // The preview exercises the REAL flow: overlay, probe, detection
        // folding the bar into the localized return button, storm exit.
        if (/[?&]preview=recovery\b/.test(location.search)) {
          showRecovery();
          startProbe();
        }

        function recover() {
          if (booted) return;
          showRecovery();
          startProbe();
          stormReload('numap-boot-retry');
        }

        // STALE BUILD IN A LIVE TAB — the other half of the post-deploy
        // problem. The recovery above only guards BOOT: once the entry bundle
        // has run, `booted` short-circuits it. But the app lazy-loads program
        // data (import.meta.glob with eager:false — majors, grad-majors and
        // minors, thousands of chunks), so a tab left open across a deploy
        // asks for a hash that was deleted and the import simply rejects.
        // Nothing was watching for that, which is why the page needed a
        // manual hard refresh. `no-cache` on the HTML shell cannot help here:
        // the shell already loaded, correctly, before the deploy happened.
        window.addEventListener('vite:preloadError', function (e) {
          if (e && e.preventDefault) e.preventDefault();  // we handle it by reloading
          showRecovery();
          startProbe();
          stormReload('numap-chunk-retry');
        });
        // Backstop for a dynamic import that rejects without going through
        // Vite's preload helper. Matched on message rather than type, and
        // deliberately narrow so ordinary app errors never trigger a reload.
        window.addEventListener('unhandledrejection', function (e) {
          var m = e && e.reason && (e.reason.message || String(e.reason));
          if (m && /Failed to fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed/i.test(m)) {
            showRecovery();
            startProbe();
            stormReload('numap-chunk-retry');
          }
        });
        // A module script that 404s or is served with a non-JS MIME fires a
        // resource 'error' (target is the <script>). Runtime exceptions after
        // the bundle loads have no SCRIPT target, so we never reload on app bugs.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT') recover();
        }, true);
        // Backstop for silent failures (e.g. a blocked module with no error event).
        setTimeout(recover, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Crawlers/AI summarizers that don't execute JS see an empty React
           root; this gives them real, disclaimer-first page text. Replaced
           by the app on mount, so users never see it. -->
      <noscript>
        <h1>NU Map | Student-Built Northeastern Course Planner</h1>
        <p>
          NU Map is a <strong>student-built</strong> course planner for
          Northeastern University students. It is <strong>not affiliated with, endorsed by,
          or officially connected to Northeastern University</strong>. Plan your courses
          semester by semester, visualize prerequisites, and track graduation requirements.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
